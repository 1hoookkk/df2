<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>df2 — SHAPE</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* df2 SHAPE — FULLY PAINTER.
   One canvas. Every pixel is drawn (no DOM widgets), so this maps 1:1 to
   egui: ui.allocate_painter(...) then paint(rect) with rect_filled /
   rect_stroke / Shape::line / painter.text, and manual hit-testing of rects.
   No gradients, no shadows, no blur — all flat. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0a0f0c; display:flex; align-items:center; justify-content:center; padding:22px;}
#ui{width:min(960px,97vw); height:min(600px,94vh); display:block; cursor:default;}
</style>
</head>
<body>
<canvas id="ui"></canvas>
<script>
/* ---------- palette (egui Color32 later) ---------- */
const C={bg:'#0a0f0c',field:'#0a110c',grid:'#16291d',edge:'#21402b',ink:'#cfe5cf',dim:'#5d6f60',ion:'#7dff56'};
const FONT='Fredoka,system-ui,sans-serif';

/* ---------- honest biquad magnitude (trench-core provides this for real) ---------- */
const SR=48000;
function magDb(fs,peaks){return fs.map(f=>{let db=0;const w=2*Math.PI*f/SR,cw=Math.cos(w),sw=Math.sin(w);
  for(const p of peaks){const A=Math.pow(10,p.g/40),w0=2*Math.PI*p.f/SR,al=Math.sin(w0)/(2*p.q);
    const b0=1+al*A,b1=-2*Math.cos(w0),b2=1-al*A,a0=1+al/A,a1=-2*Math.cos(w0),a2=1-al/A;
    const nr=b0+b1*cw+b2*Math.cos(2*w),ni=-(b1*sw+b2*Math.sin(2*w));
    const dr=a0+a1*cw+a2*Math.cos(2*w),di=-(a1*sw+a2*Math.sin(2*w));
    db+=20*Math.log10(Math.sqrt((nr*nr+ni*ni)/(dr*dr+di*di)));}return db;});}
function fgrid(n){const lo=Math.log10(20),hi=Math.log10(20000),a=[];for(let i=0;i<n;i++)a.push(Math.pow(10,lo+(hi-lo)*i/(n-1)));return a;}
const FS=fgrid(130), MAXDB=18;
const A=magDb(FS,[{f:140,g:7,q:.8},{f:520,g:4,q:.7}]);      // MORPH end A  (MELLOW)
const B=magDb(FS,[{f:3200,g:14,q:7}]);                      // MORPH end B  (SCREAM)
const OPEN=magDb(FS,[{f:330,g:5,q:.7},{f:1300,g:4,q:.8}]);  // SECONDARY open
const CLENCH=magDb(FS,[{f:330,g:11,q:6},{f:1300,g:10,q:6}]);// SECONDARY clenched

/* ---------- state ---------- */
let morph=0.5, secondary=0.5, auto=false, tab=0;
const TABS=['SHAPE','PLAYER','PUSH'];
let hot={tabs:[],morphTrack:null,secTrack:null,autoBox:null}; // hit rects, rebuilt each paint

const cv=document.getElementById('ui'); let W=0,H=0,c=null;
function begin(){const dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);
  cv.width=W*dpr;cv.height=H*dpr;c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);}
function rectF(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function rectS(x,y,w,h,col,lw=1){c.strokeStyle=col;c.lineWidth=lw;c.strokeRect(x+.5,y+.5,w-1,h-1);}
function text(t,x,y,col,size=11,weight=600,align='left'){c.fillStyle=col;c.font=`${weight} ${size}px ${FONT}`;c.textAlign=align;c.textBaseline='alphabetic';c.fillText(t,x,y);}
function inR(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

/* a response box: flat fill + frame + faint grid + curve(s) */
function plotBox(x,y,w,h,label,labelCol){
  rectF(x,y,w,h,C.field); rectS(x,y,w,h,C.edge,1);
  c.strokeStyle=C.grid;c.lineWidth=1;
  for(let i=1;i<4;i++){const gx=x+w*i/4;c.beginPath();c.moveTo(gx,y);c.lineTo(gx,y+h);c.stroke();}
  for(let i=1;i<3;i++){const gy=y+h*i/3;c.beginPath();c.moveTo(x,gy);c.lineTo(x+w,gy);c.stroke();}
  if(label) text(label,x+7,y+15,labelCol,11,600);
}
function plotCurve(db,x,y,w,h,col,fill){
  const pts=FS.map((f,i)=>{const v=Math.max(0,Math.min(MAXDB,db[i]));return [x+5+(w-10)*i/(FS.length-1), y+h-5-(v/MAXDB)*(h-22)];});
  if(fill){c.beginPath();c.moveTo(pts[0][0],y+h-5);pts.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(pts[pts.length-1][0],y+h-5);c.closePath();c.fillStyle=fill;c.fill();}
  c.strokeStyle=col;c.lineWidth=2;c.lineJoin='round';c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
}

/* a slider: track + fill + thumb (three rects). returns its hit rect */
function slider(label,x,y,w,v,dim){
  text(label,x,y+5,C.ink,10,600);
  const tx=x+92, tw=x+w-tx, th=6, ty=y;
  rectF(tx,ty,tw,th,'#0e1e14'); rectS(tx,ty,tw,th,C.edge,1);
  rectF(tx,ty,tw*v,th,dim?C.dim:C.ion);
  const px=tx+tw*v; rectF(px-5,ty-5,10,16,dim?C.dim:C.ion);
  return {x:tx,y:ty-6,w:tw,h:18};
}

function paint(){
  begin(); if(!c)return;
  rectF(0,0,W,H,C.bg);
  const pad=18;

  /* header: df2 + tabs */
  text('df2',pad,30,C.ion,17,600);
  hot.tabs=[]; let tx=pad+52;
  c.font='500 13px '+FONT;
  TABS.forEach((t,i)=>{const tw=c.measureText(t).width;
    text(t,tx,30,i===tab?C.ink:C.dim,13,500);
    if(i===tab){rectF(tx,36,tw,2,C.ion);}
    hot.tabs.push({x:tx,y:16,w:tw,h:26}); tx+=tw+18;});

  /* layout: sections row above, controls below */
  const ctlH=64, secTop=52, secBot=H-ctlH-pad, midX=Math.round(W/2);
  rectF(midX,secTop+6,1,secBot-secTop-12,C.edge); // divider

  /* SECTION 1 · MORPH — [A] —•— [B] */
  drawSection(pad, secTop, midX-pad-14, secBot, '1','MORPH','IDENTITY · A → B', g=>{
    const {x,y,w,h}=g; const sq=Math.min(h-26,(w-50)/2), sy=y+26+((h-26)-sq)/2;
    plotBox(x,sy,sq,sq,'MELLOW','#ffb43c'); plotCurve(A,x,sy,sq,sq,'#ffb43c','rgba(255,180,60,.14)');
    const xB=x+w-sq; plotBox(xB,sy,sq,sq,'SCREAM','#ff4a3d'); plotCurve(B,xB,sy,sq,sq,'#ff4a3d','rgba(255,74,61,.14)');
    const ly=sy+sq/2, lx0=x+sq, lx1=xB;
    c.strokeStyle=C.edge;c.lineWidth=2;c.beginPath();c.moveTo(lx0,ly);c.lineTo(lx1,ly);c.stroke();
    const dx=lx0+(lx1-lx0)*morph; rectF(dx-1,sy,2,sq,'rgba(125,255,86,.18)');
    c.fillStyle=C.field;c.strokeStyle=C.ion;c.lineWidth=2;c.beginPath();c.arc(dx,ly,6,0,7);c.fill();c.stroke();
    c.fillStyle=C.ion;c.beginPath();c.arc(dx,ly,2.2,0,7);c.fill();
  });

  /* SECTION 2 · SECONDARY — two ends (OPEN, CLENCHED) of the SAME sound */
  drawSection(midX+14, secTop, W-pad-(midX+14), secBot, '2','SECONDARY','CONDITION · OPEN → CLENCHED', g=>{
    const {x,y,w,h}=g; const sq=Math.min(h-26,(w-50)/2), sy=y+26+((h-26)-sq)/2;
    plotBox(x,sy,sq,sq,'OPEN','#8fe04a'); plotCurve(OPEN,x,sy,sq,sq,'#8fe04a','rgba(143,224,74,.14)');
    const xB=x+w-sq; plotBox(xB,sy,sq,sq,'CLENCHED','#ff6a2a'); plotCurve(CLENCH,xB,sy,sq,sq,'#ff6a2a','rgba(255,106,42,.14)');
    const ly=sy+sq/2, lx0=x+sq, lx1=xB;
    c.strokeStyle=C.edge;c.lineWidth=2;c.beginPath();c.moveTo(lx0,ly);c.lineTo(lx1,ly);c.stroke();
    const dx=lx0+(lx1-lx0)*secondary; rectF(dx-1,sy,2,sq,'rgba(125,255,86,.18)');
    c.fillStyle=C.field;c.strokeStyle=C.ion;c.lineWidth=2;c.beginPath();c.arc(dx,ly,6,0,7);c.fill();c.stroke();
    c.fillStyle=C.ion;c.beginPath();c.arc(dx,ly,2.2,0,7);c.fill();
  });

  /* controls: two sliders + auto-morph checkbox */
  const cy=H-ctlH+6;
  hot.morphTrack=slider('MORPH',pad,cy,W-pad*2-120,morph,auto);
  // auto checkbox to the right of morph row
  const bx=W-pad-110, by=cy-1; rectF(bx,by,13,13,auto?C.ion:C.field); rectS(bx,by,13,13,C.edge,1);
  text('AUTO MORPH',bx+19,cy+5,auto?C.ion:C.dim,10,600); hot.autoBox={x:bx,y:by-3,w:120,h:18};
  hot.secTrack=slider('SECONDARY',pad,cy+26,W-pad*2-120,secondary,false);
}

function drawSection(x,top,w,bottom,num,name,sub,inner){
  text(num,x,top+24,C.dim,30,600);
  const nx=x+num.length*20+6;
  text(name,nx,top+22,C.ion,14,600);
  text(sub,x+w,top+12,C.dim,10,600,'right');
  inner({x,y:top,w,h:bottom-top}); // inner uses y+26 for header, h = body height
}

/* ---------- interaction ---------- */
function pt(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
let dragging=null;
cv.addEventListener('mousedown',e=>{const p=pt(e);
  if(inR(p,hot.autoBox)){auto=!auto;paint();return;}
  hot.tabs.forEach((r,i)=>{if(inR(p,r))tab=i;});
  if(inR(p,hot.morphTrack)&&!auto){dragging='morph';setFromX(p);}
  else if(inR(p,hot.secTrack)){dragging='sec';setFromX(p);}
  paint();});
addEventListener('mousemove',e=>{if(!dragging)return;setFromX(pt(e));paint();});
addEventListener('mouseup',()=>dragging=null);
function setFromX(p){const r=dragging==='morph'?hot.morphTrack:hot.secTrack; if(!r)return;
  const v=Math.max(0,Math.min(1,(p.x-r.x)/r.w)); if(dragging==='morph')morph=v; else secondary=v;}

requestAnimationFrame(paint);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paint);
addEventListener('resize',()=>requestAnimationFrame(paint));
</script>
</body>
</html>
