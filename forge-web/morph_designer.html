<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>df2 — Morph Designer</title>
<link rel="stylesheet" href="css/basic.css">
<style>
  .md{display:flex;flex-direction:column;height:100dvh;gap:8px;padding:10px;max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:center}
  .nameInput{height:26px;flex:1;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 8px;font:12px Consolas,monospace}
  .graphWrap{height:150px;border:1px solid var(--ink);background:#0f1a12}
  #plot{display:block;width:100%;height:100%}
  .knobrow{display:flex;gap:10px;align-items:center;font:11px Consolas,monospace}
  .knobrow label{display:flex;flex-direction:column;gap:2px;flex:1}
  .knobrow input[type=range]{width:100%}
  .stageBox{border:1px solid var(--line);background:#efe9dc;padding:8px;display:grid;gap:7px}
  .stageHead{display:flex;gap:8px;align-items:center;font:700 11px Arial;text-transform:uppercase;letter-spacing:.05em}
  .stageHead select{height:26px}
  .stageNav{display:flex;gap:3px}
  .stageNav button{width:26px;height:24px;border:1px solid var(--line);background:#fffdf7;cursor:pointer;font:11px Consolas,monospace}
  .stageNav button.on{background:var(--ink);color:#fffdf7}
  .morphCols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mcol{border:1px solid var(--line);background:#fffdf7;padding:6px;display:grid;gap:5px}
  .mcol h5{margin:0;font:700 10px Arial;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .field{display:grid;grid-template-columns:42px 1fr 52px;gap:5px;align-items:center;font:11px Consolas,monospace}
  .field input[type=range]{width:100%}
  .bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bar button,.chip{height:32px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 10px;cursor:pointer;font:12px Consolas,monospace}
  #play.on{background:var(--hot,#c52f4d);color:#fff;border-color:var(--hot,#c52f4d)}
  .chip.on{background:var(--ink);color:#fffdf7}
  #meter{width:80px;height:12px;border:1px solid var(--line);background:#efe9dc;position:relative;overflow:hidden}
  #meter>i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#5ba35a}
  #meter.flood{outline:2px solid var(--bad,#c52f4d)} #meter.flood>i{background:var(--bad,#c52f4d)}
  footer{font:11px Consolas,monospace;color:var(--muted)}
</style>
</head>
<body>
<main class="md">
  <div class="top"><b style="font-family:Arial">MORPH DESIGNER</b><input id="nameInput" class="nameInput" value="morph_body" spellcheck="false"></div>
  <div class="graphWrap"><canvas id="plot"></canvas></div>
  <div class="knobrow">
    <label>MORPH % <input id="morph" type="range" min="0" max="100" value="0"><output id="mOut">0</output></label>
    <label>DRIVE % <input id="drive" type="range" min="0" max="100" value="40"><output id="dOut">40</output></label>
  </div>
  <section class="stageBox">
    <div class="stageHead">
      STAGE <div id="stageNav" class="stageNav"></div>
      SHAPE <select id="shape">
        <option value="LP">LP</option><option value="HP">HP</option><option value="BP">BP</option>
        <option value="peak">Peak</option><option value="notch">Notch</option>
        <option value="lowshelf">Lo Shelf</option><option value="highshelf">Hi Shelf</option><option value="off">Off</option>
      </select>
      GAIN <input id="gain" type="range" min="-24" max="24" step="0.5" value="0" style="flex:1"><output id="gOut">0</output>
    </div>
    <div class="morphCols">
      <div class="mcol"><h5>— LO MORPH —</h5>
        <div class="field"><span>FREQ</span><input id="loFreq" type="range" min="40" max="18000" value="500"><output id="loFreqV">500</output></div>
        <div class="field"><span>Q</span><input id="loQ" type="range" min="0.3" max="40" step="0.1" value="3"><output id="loQV">3</output></div>
      </div>
      <div class="mcol"><h5>— HI MORPH —</h5>
        <div class="field"><span>FREQ</span><input id="hiFreq" type="range" min="40" max="18000" value="500"><output id="hiFreqV">500</output></div>
        <div class="field"><span>Q</span><input id="hiQ" type="range" min="0.3" max="40" step="0.1" value="3"><output id="hiQV">3</output></div>
      </div>
    </div>
  </section>
  <div class="bar">
    <button id="play">▶ play</button><div id="meter"><i></i></div>
    <button class="chip on" data-src="2">808</button><button class="chip" data-src="0">saw</button>
    <button class="chip" data-src="3">voice</button><button class="chip" data-src="1">noise</button>
    <button id="saveBtn">save .body240</button>
  </div>
  <footer id="status">loading…</footer>
</main>
<script type="module" src="js/morph-designer.js?v=md-20260608"></script>
</body>
</html>
