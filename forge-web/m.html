<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TRENCH · m</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06070a;--bg2:#0a0c11;--panel:#0e1117;--panel2:#121620;--line:#1b2029;--line2:#262d3a;
    --ink:#e8ecf2;--dim:#697384;--faint:#3a4250;--heat:#ff6a2e;--heat-hi:#ffd2a6;--cool:#37d6c4;
    --flood:#ff2d2d;--good:#46c97a;--mono:"Spline Sans Mono",ui-monospace,monospace;--disp:"Bricolage Grotesque",var(--mono)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
    overflow:hidden;-webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100dvh}
  /* top bar */
  #top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
  #menu{font-size:20px;background:none;border:none;color:var(--ink);padding:2px 6px}
  .name{flex:1;min-width:0;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name b{color:var(--dim);font-weight:400}
  #scorePill{font-size:10px;padding:5px 9px;border:1px solid var(--line2);border-radius:999px;color:var(--dim);white-space:nowrap}
  #scorePill.pass{color:var(--good);border-color:rgba(70,201,122,.45)}
  #scorePill.fail{color:var(--flood);border-color:rgba(255,45,45,.45)}
  #save{font-family:var(--disp);font-weight:800;font-size:12px;background:var(--heat);color:#120600;border:none;border-radius:8px;padding:9px 13px}
  #save:disabled{opacity:.5}
  /* curve */
  #curveWrap{flex:1;position:relative;min-height:0;background:radial-gradient(140% 120% at 50% 0%,#0d1219,#070a0e)}
  #curve{display:block;width:100%;height:100%;touch-action:none}
  #shapeHint{position:absolute;left:10px;top:8px;font-size:10px;color:var(--faint);pointer-events:none}
  /* mode tabs */
  #tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)}
  .tab{flex:1;text-align:center;padding:11px;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--dim);background:none;border:none}
  .tab.on{color:var(--ink)} .tab.PLAY.on{box-shadow:inset 0 -2px 0 var(--heat)} .tab.SHAPE.on{box-shadow:inset 0 -2px 0 var(--cool)}
  /* bottom controls */
  #ctl{padding:12px;display:flex;flex-direction:column;gap:12px}
  /* PLAY: pad + transport */
  #padWrap{position:relative;width:100%;aspect-ratio:1.35/1;max-height:38vh}
  #pad{display:block;width:100%;height:100%;border:1px solid var(--line2);border-radius:12px;touch-action:none;
    background:radial-gradient(120% 120% at 0% 100%,rgba(255,106,46,.12),transparent 60%),
    radial-gradient(120% 120% at 100% 0%,rgba(55,214,196,.12),transparent 60%),#0a0d12}
  .padlbl{position:absolute;font-size:9px;color:var(--faint);pointer-events:none}
  .row{display:flex;gap:10px;align-items:center}
  #play{flex:1;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.1em;padding:16px;border-radius:10px;
    background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
  #play.on{background:var(--heat);color:#120600;border-color:var(--heat)}
  #meter{width:14px;align-self:stretch;border:1px solid var(--line2);border-radius:6px;background:#070a0e;position:relative;overflow:hidden}
  #meter i{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(0deg,var(--good),var(--heat) 70%,var(--flood))}
  #meter.flood{box-shadow:0 0 12px var(--flood);border-color:var(--flood)}
  .chips{display:flex;gap:6px}
  .chip{flex:1;text-align:center;padding:11px 0;font-size:12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--dim)}
  .chip.on{border-color:var(--cool);color:var(--cool)}
  .knob{display:flex;flex-direction:column;gap:7px}
  .knob label{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
  .knob label b{color:var(--ink);font-weight:500}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:var(--line2);outline:none;width:100%}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--heat);box-shadow:0 0 10px rgba(255,106,46,.6)}
  /* SHAPE controls */
  .frameRow{display:flex;gap:8px}
  .frameBtn{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);font-size:12px;letter-spacing:.08em}
  .frameBtn.on{color:var(--ink)} .frameBtn.A.on{border-color:var(--heat);color:var(--heat-hi)} .frameBtn.B.on{border-color:var(--cool);color:var(--cool)}
  .hidden{display:none!important}
  /* source sheet */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.18s;z-index:10}
  #scrim.open{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;max-height:78dvh;background:var(--panel);border-top:1px solid var(--line2);
    border-radius:16px 16px 0 0;transform:translateY(100%);transition:.22s cubic-bezier(.2,.8,.2,1);z-index:11;display:flex;flex-direction:column}
  #sheet.open{transform:translateY(0)}
  .sheetHead{padding:14px 16px;font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .sheetHead button{margin-left:auto;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:8px 12px;font:inherit;font-size:12px}
  #srclist{overflow-y:auto;padding:8px 10px 16px}
  .grp{font-size:10px;color:var(--faint);letter-spacing:.2em;margin:10px 6px 4px;text-transform:uppercase}
  .src{display:block;width:100%;text-align:left;margin:4px 0;padding:13px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:13px}
  .src.on{border-color:var(--heat);color:var(--heat-hi);background:linear-gradient(90deg,rgba(255,106,46,.14),transparent)}
  #fitStatus{padding:0 16px 12px;font-size:10.5px;color:var(--dim);line-height:1.4;min-height:14px}
  #fitStatus.ok{color:var(--good)} #fitStatus.bad{color:var(--flood)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="menu">☰</button>
    <div class="name"><b>body</b> <span id="srcName">—</span></div>
    <div id="scorePill">—</div>
    <button id="save">SAVE</button>
  </div>
  <div id="curveWrap"><canvas id="curve"></canvas><div id="shapeHint" class="hidden">drag a zero (◆) onto each pole</div></div>
  <div id="tabs">
    <button class="tab PLAY on" data-mode="play">PLAY</button>
    <button class="tab SHAPE" data-mode="shape">SHAPE</button>
  </div>
  <div id="ctl">
    <div id="playCtl">
      <div id="padWrap">
        <canvas id="pad"></canvas>
        <span class="padlbl" style="left:8px;top:6px">A·sharp</span><span class="padlbl" style="right:8px;top:6px">B·sharp</span>
        <span class="padlbl" style="left:8px;bottom:6px">A·broad</span><span class="padlbl" style="right:8px;bottom:6px">B·broad</span>
      </div>
      <div class="row">
        <button id="play">▶ PLAY</button>
        <div id="meter"><i></i></div>
      </div>
      <div class="chips">
        <div class="chip" data-src="2">808</div><div class="chip on" data-src="0">saw</div>
        <div class="chip" data-src="3">voice</div><div class="chip" data-src="1">noise</div>
      </div>
      <div class="knob"><label>drive · slam <b id="rDrive">40</b></label><input id="drive" type="range" min="0" max="100" value="40"></div>
    </div>
    <div id="shapeCtl" class="hidden">
      <div class="frameRow">
        <button class="frameBtn A on" data-frame="0">FRAME A</button>
        <button class="frameBtn B" data-frame="1">FRAME B</button>
      </div>
      <div class="knob"><label>morph <b id="rMorph">0</b></label><input id="morph" type="range" min="0" max="100" value="0"></div>
      <div class="knob"><label>Q · radius <b id="rQ">0</b></label><input id="q" type="range" min="0" max="100" value="0"></div>
    </div>
  </div>
</div>
<div id="scrim"></div>
<div id="sheet">
  <div class="sheetHead">source · fit poles
    <input type="file" id="audioFile" accept="audio/*" style="display:none">
    <button id="fitBtn">⊞ fit audio</button>
  </div>
  <div id="fitStatus"></div>
  <div id="srclist"></div>
</div>
<script src="data/sources.js"></script>
<script>
/* ===== packed math (plot==engine, copied verbatim from the proven studio path) ===== */
const SR=39062.5,TAU=Math.PI*2,F_LO=40,F_HI=18000,MAX_RADIUS=0.999999999999999;
const WASM_URL="wasm/forge_web_wasm.wasm?v=m1";
const CK=["M0_Q0","M100_Q0","M0_Q100","M100_Q100"],ST=6,WD=5;
const $=id=>document.getElementById(id);
function decodeWord(w){const u=(w&0xffff)+1;if(u===65536)return 1;if(u===1)return 0;const e=(u>>12)&0xf,m=u&0xfff;return e===0?(m/4096)*Math.pow(2,-15):((m+4096)/8192)*Math.pow(2,e-15);}
function i16(n){const u=n&0xffff;return u>=0x8000?u-0x10000:u;}
function lerpU16(a,b,f){const d=(b|0)-(a|0);return (i16(Math.trunc(Math.fround(d*Math.fround(f))))+(a|0))&0xffff;}
function k2b(k){const[c0,c1,c2,c3,c4]=k;return[c4,(c0-2)*c4,(1-c1)*c4,c2-2,1-c3];}
function rowK(r){const d=r.map(decodeWord);return[4*d[0]+d[1],d[1],4*d[2]+d[3],d[3],4*d[4]];}
function wordsFromBytes(b){const o={};let p=0;for(const k of CK){o[k]=[];for(let s=0;s<ST;s++){const r=[];for(let w=0;w<WD;w++,p+=2)r.push(b[p]|(b[p+1]<<8));o[k].push(r);}}return o;}
function wordsAt(W,m,q){const o=[],A=W.M0_Q0,B=W.M100_Q0,C=W.M0_Q100,D=W.M100_Q100;for(let s=0;s<ST;s++){const r=[];for(let w=0;w<WD;w++){const e0=lerpU16(A[s][w],B[s][w],m),e1=lerpU16(C[s][w],D[s][w],m);r.push(lerpU16(e0,e1,q));}o.push(r);}return o;}
function bqDb(bq,f){const[b0,b1,b2,a1,a2]=bq,w=TAU*f/SR,c=Math.cos(w),s=Math.sin(w),c2=Math.cos(2*w),s2=Math.sin(2*w);
  const nr=b0+b1*c+b2*c2,ni=-(b1*s+b2*s2),dr=1+a1*c+a2*c2,di=-(a1*s+a2*s2);
  return 20*Math.log10(Math.max(1e-12,Math.hypot(nr,ni)/Math.max(1e-12,Math.hypot(dr,di))));}
function packedDb(W,m,q,f){let s=0;for(const r of wordsAt(W,m,q))s+=bqDb(k2b(rowK(r)),f);return s;}
function worstR(W){let mx=0;for(const[m,q]of[[0,0],[1,0],[0,1],[1,1],[.5,.5]])for(const r of wordsAt(W,m,q)){const bq=k2b(rowK(r)),a1=bq[3],a2=bq[4],d=a1*a1-4*a2,rr=d<0?Math.sqrt(Math.max(0,a2)):Math.max(Math.abs((-a1+Math.sqrt(d))/2),Math.abs((-a1-Math.sqrt(d))/2));mx=Math.max(mx,rr);}return mx;}

/* ===== state ===== */
const st={sources:window.SOURCES||[],si:-1,name:"—",sections:[],mode:"play",frame:0,morph:0,q:0,src:0,drive:.4,
  playing:false,body:null,words:null,drag:null,sel:0,scoreT:0,scoreSeq:0,saving:false,audio:null,inSec:0,outSec:0,dbHi:null,dbLo:null};

/* ===== wasm pack ===== */
let ex=null,mem=null,pv=null;
async function initWasm(){const buf=await(await fetch(WASM_URL)).arrayBuffer();const m=await WebAssembly.instantiate(buf,{});ex=m.instance.exports;mem=ex.memory;pv=new Float64Array(mem.buffer,ex.forge_params_ptr(),Number(ex.forge_params_len()));}
function packBody(){for(let ci=0;ci<4;ci++){const useB=ci===1||ci===3,sharp=ci===2||ci===3;for(let si=0;si<6;si++){const s=st.sections[si],z=useB?s.zB:s.zA,b=(ci*6+si)*7;
  pv[b]=s.on?1:0;pv[b+1]=useB?(s.pfB??s.pf):s.pf;pv[b+2]=sharp?s.prSharp:s.pr;pv[b+3]=s.gain;pv[b+4]=(z.on&&z.depth>0.02)?1:0;pv[b+5]=z.hz;pv[b+6]=z.depth;}}
  ex.forge_pack_params();const o=new Uint8Array(240);o.set(new Uint8Array(mem.buffer,ex.forge_body_ptr(),240));return o;}
const clampHz=h=>Math.max(F_LO,Math.min(F_HI,h));
function dcpin(pf,r){const th=TAU*clampHz(pf)/SR;return Math.max(.03,Math.min(4,(1-2*r*Math.cos(th)+r*r)/Math.max(1e-4,1-r*r)));}
function lane(pf,pfB,pr,prHi,gain,zAhz,zAd,zBhz,zBd,role){const lo=Math.max(.5,Math.min(MAX_RADIUS,pr)),hi=Math.max(lo,Math.min(.999,prHi));
  return{on:true,role,pf:clampHz(pf),pfB:clampHz(pfB??pf),pr:lo,prSharp:hi,gain,
    zA:{on:zAd>.02,hz:clampHz(zAhz),depth:Math.max(0,Math.min(.985,zAd))},zB:{on:zBd>.02,hz:clampHz(zBhz),depth:Math.max(0,Math.min(.985,zBd))}};}
/* every section ships pole+ZERO (no bare all-pole = no crater). Foundation: high shelf-knee. Actors: companion canyon. You carve from here. */
function sectionsFrom(src){const PRHI=[.985,.991,.996];let k=0;
  return(src.sections||[]).map((s,i)=>{const role=s.role||(i<3?"foundation body":"source actor");const found=role.indexOf("foundation")===0;
    const pf=s.pf,pr=s.pr??.85;
    if(found){const prHi=Math.min(.90,pr+.03);const zk=clampHz(pf*2.6);return lane(pf,pf,pr,prHi,dcpin(pf,pr),zk,.6,zk,.6,role);}
    const j=Math.min(2,k++);const away=clampHz(pf*(1.7+.5*j));const prHi=Math.min(.999,Math.max(PRHI[j],pr+.012));
    const z=clampHz(pf*1.5);return lane(pf,away,pr,prHi,dcpin(pf,pr),z,.78,z,.78,role);});}
function normGain(target=-24){if(!ex||!st.sections.length)return;const W=wordsFromBytes(packBody());let pk=-1e9;
  for(const[m,q]of[[0,0],[1,0],[0,1],[1,1],[.5,.5]])for(let i=0;i<96;i++){const f=Math.exp(Math.log(F_LO)+i/95*(Math.log(F_HI)-Math.log(F_LO)));pk=Math.max(pk,packedDb(W,m,q,f));}
  if(!isFinite(pk))return;const per=Math.pow(10,Math.max(-18,Math.min(30,target-pk))/(20*6));st.sections.forEach(s=>s.gain=Math.max(.05,Math.min(4,s.gain*per)));}

/* ===== rebuild / curve ===== */
function rebuild(){if(!ex)return;st.body=packBody();st.words=wordsFromBytes(st.body);const r=worstR(st.words);
  if(anode)anode.port.postMessage({body:st.body.buffer.slice(0)});draw();scheduleScore();}
function loadSource(i){const s=st.sources[i];if(!s)return;st.si=i;st.name=s.name;$("srcName").textContent=s.name;st.sections=sectionsFrom(s);normGain();st.dbHi=null;
  document.querySelectorAll(".src").forEach((el,k)=>el.classList.toggle("on",k===i));rebuild();}
const cv=$("curve"),cx=cv.getContext("2d");let CW=0,CH=0,dpr=1;
const fx=(f,w)=>(Math.log(Math.max(F_LO,Math.min(F_HI,f)))-Math.log(F_LO))/(Math.log(F_HI)-Math.log(F_LO))*w;
const ifx=(px,w)=>Math.exp(Math.log(F_LO)+px/w*(Math.log(F_HI)-Math.log(F_LO)));
function samples(m,q,n,w){const a=new Array(n);for(let i=0;i<n;i++)a[i]=packedDb(st.words,m,q,ifx(i/(n-1)*w,w));return a;}
function draw(){if(!st.words)return;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,CW,CH);
  const pL=8,pR=8,pT=14,pB=16,w=CW-pL-pR,h=CH-pT-pB;
  const live=samples(st.morph,st.q,Math.max(120,w|0),w);let mx=-1e9;for(const v of live)if(v>mx)mx=v;
  if(st.dbHi==null||mx>st.dbHi-4){st.dbHi=Math.ceil((mx+12)/6)*6;st.dbLo=st.dbHi-96;}
  const HI=st.dbHi,LO=st.dbLo,fy=db=>pT+(1-(Math.max(LO,Math.min(HI,db))-LO)/(HI-LO))*h;
  cx.font="10px Spline Sans Mono";
  for(let db=Math.ceil(LO/12)*12;db<=HI-2;db+=12){const y=fy(db);cx.strokeStyle=db===0?"#27313d":"#10151c";cx.beginPath();cx.moveTo(pL,y);cx.lineTo(pL+w,y);cx.stroke();}
  cx.strokeStyle="#141a22";for(const f of[100,1000,10000]){const x=pL+fx(f,w);cx.beginPath();cx.moveTo(x,pT);cx.lineTo(x,pT+h);cx.stroke();cx.fillStyle="#3a4250";cx.fillText(f>=1000?f/1000+"k":f,x+3,pT+h-4);}
  for(const[m,q,c]of[[0,0,"rgba(255,106,46,.16)"],[1,0,"rgba(55,214,196,.16)"],[1,1,"rgba(255,210,166,.12)"]]){const g=samples(m,q,Math.max(120,w|0),w);cx.strokeStyle=c;cx.beginPath();g.forEach((v,i)=>{const x=pL+i/(g.length-1)*w,y=fy(v);i?cx.lineTo(x,y):cx.moveTo(x,y);});cx.stroke();}
  cx.strokeStyle="#ffb26b";cx.lineWidth=2;cx.beginPath();live.forEach((v,i)=>{const x=pL+i/(live.length-1)*w,y=fy(v);i?cx.lineTo(x,y):cx.moveTo(x,y);});cx.stroke();cx.lineWidth=1;
  if(st.mode==="shape")st.sections.forEach((s,i)=>{if(!s.on)return;const px=pL+fx(s.pf,w),sel=i===st.sel;
    cx.strokeStyle="#ff6a2e";cx.globalAlpha=sel?.95:.5;cx.lineWidth=sel?2.5:1.5;cx.beginPath();cx.moveTo(px,pT);cx.lineTo(px,pT+(sel?16:9));cx.stroke();cx.globalAlpha=1;cx.lineWidth=1;
    const z=st.frame?s.zB:s.zA,zx=pL+fx(z.hz,w),zy=pT+12+z.depth*(h-24);cx.fillStyle=z.depth>.02?"#37d6c4":"#2a323d";cx.strokeStyle="#37d6c4";
    cx.beginPath();cx.moveTo(zx,zy-9);cx.lineTo(zx+8,zy);cx.lineTo(zx,zy+9);cx.lineTo(zx-8,zy);cx.closePath();cx.fill();cx.stroke();
    if(sel){cx.strokeStyle="rgba(255,255,255,.5)";cx.beginPath();cx.arc(zx,zy,16,0,7);cx.stroke();}});}
/* zero drag (SHAPE) */
function hit(px,py){const pL=8,pT=14,pB=16,w=CW-16,h=CH-pT-pB;let best=-1,bd=44;st.sections.forEach((s,i)=>{if(!s.on)return;const z=st.frame?s.zB:s.zA;const zx=pL+fx(z.hz,w),zy=pT+12+z.depth*(h-24),d=Math.hypot(px-zx,py-zy);if(d<bd){bd=d;best=i;}});return best;}
function nearest(px){const pL=8,w=CW-16;let best=0,bd=1e9;st.sections.forEach((s,i)=>{if(!s.on)return;const z=st.frame?s.zB:s.zA,anc=z.on&&z.depth>.02?z.hz:s.pf,d=Math.abs(px-(pL+fx(anc,w)));if(d<bd){bd=d;best=i;}});return best;}
cv.addEventListener("pointerdown",e=>{if(st.mode!=="shape")return;const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,i=hit(px,py);st.drag=i>=0?i:nearest(px);st.sel=st.drag;cv.setPointerCapture(e.pointerId);cdrag(px,py);});
cv.addEventListener("pointermove",e=>{if(typeof st.drag!=="number")return;const r=cv.getBoundingClientRect();cdrag(e.clientX-r.left,e.clientY-r.top);});
cv.addEventListener("pointerup",()=>{st.drag=null;});
function cdrag(px,py){const pL=8,pT=14,pB=16,w=CW-16,h=CH-pT-pB,s=st.sections[st.drag],z=st.frame?s.zB:s.zA;
  z.hz=Math.max(F_LO,Math.min(F_HI,ifx(px-pL,w)));if(!z.on||z.depth<=.02)z.depth=.78;else z.depth=Math.max(.08,Math.min(.985,(py-pT-12)/(h-24)));z.on=z.depth>.02;st.dbHi=null;rebuild();}

/* ===== pad (Morph×Q) ===== */
const pad=$("pad"),px2=pad.getContext("2d");let PW=0,PH=0;
function drawPad(){px2.setTransform(dpr,0,0,dpr,0,0);px2.clearRect(0,0,PW,PH);px2.strokeStyle="#1b2029";
  for(let i=1;i<4;i++){px2.beginPath();px2.moveTo(PW*i/4,0);px2.lineTo(PW*i/4,PH);px2.moveTo(0,PH*i/4);px2.lineTo(PW,PH*i/4);px2.stroke();}
  const x=st.morph*PW,y=(1-st.q)*PH;px2.strokeStyle="rgba(255,106,46,.3)";px2.beginPath();px2.moveTo(x,0);px2.lineTo(x,PH);px2.moveTo(0,y);px2.lineTo(PW,y);px2.stroke();
  px2.save();px2.shadowColor="#ff6a2e";px2.shadowBlur=20;px2.fillStyle="#ffd2a6";px2.beginPath();px2.arc(x,y,13,0,7);px2.fill();px2.restore();
  px2.fillStyle="#120600";px2.beginPath();px2.arc(x,y,4.5,0,7);px2.fill();}
function setMQ(m,q){st.morph=Math.max(0,Math.min(1,m));st.q=Math.max(0,Math.min(1,q));$("morph").value=Math.round(st.morph*100);$("q").value=Math.round(st.q*100);$("rMorph").textContent=Math.round(st.morph*100);$("rQ").textContent=Math.round(st.q*100);drawPad();draw();pushParams();}
function padSet(px,py){setMQ(px/PW,1-py/PH);}
pad.addEventListener("pointerdown",e=>{st.drag="pad";pad.setPointerCapture(e.pointerId);const r=pad.getBoundingClientRect();padSet(e.clientX-r.left,e.clientY-r.top);});
pad.addEventListener("pointermove",e=>{if(st.drag!=="pad")return;const r=pad.getBoundingClientRect();padSet(e.clientX-r.left,e.clientY-r.top);});
pad.addEventListener("pointerup",()=>{st.drag=null;});

/* ===== audio ===== */
let actx=null,anode=null;
function driveParams(){const d=Math.max(0,Math.min(1,st.drive));return{agc:4+4*d,slam:.25*d*d,wide:0,inputGain:1,makeup:1.5+2.5*d};}
function pushParams(){if(!anode)return;const p=driveParams();anode.port.postMessage({params:{morph:st.morph,q:st.q,agc:p.agc,slam:p.slam,wide:p.wide,inputGain:p.inputGain,makeup:p.makeup}});}
async function startAudio(){actx=new(window.AudioContext||window.webkitAudioContext)();const wasm=await(await fetch(WASM_URL)).arrayBuffer();await actx.audioWorklet.addModule("js/forge-worklet.js");
  anode=new AudioWorkletNode(actx,"forge-processor",{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2],processorOptions:{wasm,body:st.body?st.body.buffer.slice(0):null,src:st.src}});
  anode.port.onmessage=e=>{if(e.data.ready){pushParams();if(st.playing)anode.port.postMessage({playing:true});}if(e.data.level!=null){const m=$("meter");m.firstElementChild.style.height=Math.min(100,e.data.level*140)+"%";m.classList.toggle("flood",e.data.peak>.985);}};
  anode.connect(actx.destination);}
async function toggleAudio(){try{if(!actx)await startAudio();if(actx.state==="suspended")await actx.resume();st.playing=!st.playing;if(anode)anode.port.postMessage({playing:st.playing});$("play").classList.toggle("on",st.playing);$("play").textContent=st.playing?"❚❚ STOP":"▶ PLAY";}catch(e){console.error(e);}}

/* ===== score / save / fit (same endpoints) ===== */
const post=(path,p)=>fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||path+" failed");return d;});
const bodyHex=()=>st.body?[...st.body].map(b=>b.toString(16).padStart(2,"0")).join(""):"";
function scheduleScore(){clearTimeout(st.scoreT);st.scoreT=setTimeout(scoreNow,300);}
async function scoreNow(){const pill=$("scorePill");if(!st.body||location.protocol==="file:"){pill.textContent="local";pill.className="";return;}const seq=++st.scoreSeq;
  try{const s=await post("/score",{hex:bodyHex(),grid:9});if(seq!==st.scoreSeq)return;const m=s.metrics||{};const fail=Object.entries(s.gates||{}).filter(([,v])=>!v).map(([k])=>k);
    pill.textContent=s.verdict==="PASS"?`PASS ${(m.objective||0).toFixed(0)}`:`FAIL ${fail.slice(0,2).join(" ")||""}`;pill.className=s.verdict==="PASS"?"pass":"fail";}
  catch(e){pill.textContent="score off";pill.className="";}}
function authorPayload(){return{name:st.name||"untitled",source:st.sources[st.si]?.name||null,morph:st.morph,q:st.q,
  lanes:st.sections.map(s=>({on:!!s.on,role:s.role||"lane",pf:s.pf,pfB:s.pfB??s.pf,pr:s.pr,prHi:s.prSharp,gain:s.gain,
    zA:{on:!!s.zA.on,hz:s.zA.hz,depth:s.zA.depth},zB:{on:!!s.zB.on,hz:s.zB.hz,depth:s.zB.depth}}))};}
$("save").onclick=async()=>{if(!st.body||st.saving)return;if(location.protocol==="file:"){alert("run from forge_author_server.py to save");return;}st.saving=true;$("save").textContent="…";
  try{const r=await post("/bake",authorPayload());const p=$("scorePill");p.textContent=`${r.verdict} baked`;p.className=r.verdict==="PASS"?"pass":"fail";}
  catch(e){$("scorePill").textContent="bake fail";$("scorePill").className="fail";}finally{st.saving=false;$("save").textContent="SAVE";}};

/* fit audio */
const fitStatus=(m,c="")=>{const e=$("fitStatus");e.textContent=m;e.className=c;};
$("fitBtn").onclick=()=>$("audioFile").click();
$("audioFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  if(location.protocol==="file:"){fitStatus("run from forge_author_server.py to fit","bad");return;}
  try{fitStatus("decoding…");const ab=await f.arrayBuffer();const ac=new(window.AudioContext||window.webkitAudioContext)();const buf=await ac.decodeAudioData(ab);ac.close();
    const ch=buf.numberOfChannels,n=buf.length,mono=new Float32Array(n);for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/ch;}
    const dur=n/buf.sampleRate,win=Math.min(.3,dur),a=Math.max(0,dur/2-win/2);const sl=Array.from(mono.subarray(Math.floor(a*buf.sampleRate),Math.floor((a+win)*buf.sampleRate)));
    if(sl.length<256){fitStatus("clip too short","bad");return;}
    fitStatus("fitting…");const res=await post("/fit",{samples:sl,sr:buf.sampleRate,name:f.name.replace(/\.[^.]+$/,""),found:3,preemph:.97,crank:0,qsource:"lpc"});
    const src=res.source;const idx=st.sources.findIndex(s=>s.name===src.name);if(idx>=0)st.sources[idx]=src;else st.sources.push(src);buildRail();loadSource(st.sources.findIndex(s=>s.name===src.name));
    fitStatus("loaded · "+res.poles,"ok");closeSheet();}
  catch(err){fitStatus("fit failed: "+err.message,"bad");}};

/* ===== source sheet ===== */
function buildRail(){const l=$("srclist");let h="",g="";st.sources.forEach((s,i)=>{if(s.group!==g){g=s.group;h+=`<div class="grp">${g}</div>`;}h+=`<button class="src" data-i="${i}">${s.name}</button>`;});l.innerHTML=h;l.querySelectorAll(".src").forEach(b=>b.onclick=()=>{loadSource(+b.dataset.i);closeSheet();});}
function openSheet(){$("sheet").classList.add("open");$("scrim").classList.add("open");}
function closeSheet(){$("sheet").classList.remove("open");$("scrim").classList.remove("open");}
$("menu").onclick=openSheet;$("scrim").onclick=closeSheet;

/* ===== mode + transport ===== */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{st.mode=t.dataset.mode;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  $("playCtl").classList.toggle("hidden",st.mode!=="play");$("shapeCtl").classList.toggle("hidden",st.mode!=="shape");$("shapeHint").classList.toggle("hidden",st.mode!=="shape");draw();});
document.querySelectorAll(".frameBtn").forEach(b=>b.onclick=()=>{st.frame=+b.dataset.frame;document.querySelectorAll(".frameBtn").forEach(x=>x.classList.toggle("on",x===b));draw();});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");st.src=+c.dataset.src;if(anode)anode.port.postMessage({src:st.src});});
$("play").onclick=toggleAudio;
$("drive").oninput=e=>{st.drive=e.target.value/100;$("rDrive").textContent=e.target.value;st.dbHi=null;pushParams();draw();};
$("morph").oninput=e=>setMQ(e.target.value/100,st.q);
$("q").oninput=e=>setMQ(st.morph,e.target.value/100);

/* ===== boot / resize ===== */
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);for(const[c,set]of[[cv,(w,h)=>{CW=w;CH=h;}],[pad,(w,h)=>{PW=w;PH=h;}]]){const r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);set(r.width,r.height);}draw();drawPad();}
window.addEventListener("resize",resize);
(async()=>{buildRail();try{await initWasm();}catch(e){console.error("wasm",e);}resize();if(st.sources.length)loadSource(0);})();
</script>
</body>
