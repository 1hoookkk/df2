<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>df2 — Fitter</title>
<link rel="stylesheet" href="css/basic.css">
<style>
  .ft{display:flex;flex-direction:column;height:100dvh;gap:10px;padding:10px}
  .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .nameInput{height:28px;min-width:150px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 8px}
  .micro{font:11px Consolas,monospace;color:var(--muted)}
  .canvasWrap{flex:1;min-height:280px;border:1px solid var(--ink);background:#f7f3eb;position:relative}
  #plot{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar button,.chip{height:34px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 12px;cursor:pointer;font:12px Consolas,monospace}
  #fitBtn{font-weight:700;background:var(--ink);color:#fffdf7}
  #play.on{background:var(--hot,#c52f4d);color:#fff;border-color:var(--hot,#c52f4d)}
  .chip.on{background:var(--ink);color:#fffdf7}
  #meter{width:90px;height:13px;border:1px solid var(--line);background:#efe9dc;position:relative;overflow:hidden}
  #meter>i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#5ba35a}
  #meter.flood{outline:2px solid var(--bad,#c52f4d)} #meter.flood>i{background:var(--bad,#c52f4d)}
  #stages{font:11px Consolas,monospace;color:var(--muted);white-space:pre;overflow-x:auto}
  footer{font:11px Consolas,monospace;color:var(--muted)}
</style>
</head>
<body>
<main class="ft">
  <div class="top">
    <div class="brand">df2 · Fitter</div>
    <input id="nameInput" class="nameInput" value="fitted_body" spellcheck="false" autocomplete="off">
    <span class="micro">draw the shape you want — the fitter solves 6 pole+zero stages to hit it</span>
  </div>
  <div class="canvasWrap"><canvas id="plot"></canvas></div>
  <div class="bar">
    <button id="fitBtn">⌖ fit 6 stages</button>
    <button id="clearBtn">clear</button>
    <button id="flatBtn">flat</button>
    <button id="play">▶ play</button>
    <div id="meter"><i></i></div>
    <button class="chip on" data-src="2">808</button>
    <button class="chip" data-src="0">saw</button>
    <button class="chip" data-src="3">voice</button>
    <button class="chip" data-src="1">noise</button>
    <button id="saveBtn">save .body240</button>
  </div>
  <div id="stages" class="micro">draw a curve, then fit</div>
  <footer id="status">loading…</footer>
</main>
<script type="module" src="js/fitter.js?v=fitter-20260608"></script>
</body>
</html>
