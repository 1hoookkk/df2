<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>df2 — Fit My Voice</title>
<link rel="stylesheet" href="css/basic.css">
<style>
  .vf{display:flex;flex-direction:column;height:100dvh;gap:10px;padding:10px;max-width:760px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .nameInput{height:28px;min-width:140px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 8px;font:12px Consolas,monospace}
  .micro{font:11px Consolas,monospace;color:var(--muted)}
  .canvasWrap{flex:1;min-height:260px;border:1px solid var(--ink);background:#f7f3eb}
  #plot{display:block;width:100%;height:100%}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar button,.chip{height:36px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 12px;cursor:pointer;font:12px Consolas,monospace}
  #recBtn{font-weight:700} #recBtn.rec{background:var(--bad,#c52f4d);color:#fff;border-color:var(--bad,#c52f4d)}
  #play.on{background:var(--hot,#c52f4d);color:#fff;border-color:var(--hot,#c52f4d)}
  .chip.on{background:var(--ink);color:#fffdf7}
  #meter{width:80px;height:12px;border:1px solid var(--line);background:#efe9dc;position:relative;overflow:hidden}
  #meter>i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#5ba35a}
  #meter.flood{outline:2px solid var(--bad,#c52f4d)} #meter.flood>i{background:var(--bad,#c52f4d)}
  #poles{font:11px Consolas,monospace;color:var(--muted);white-space:pre-wrap}
  footer{font:11px Consolas,monospace;color:var(--muted)}
</style>
</head>
<body>
<main class="vf">
  <div class="top"><b style="font-family:Arial">FIT MY VOICE</b>
    <input id="nameInput" class="nameInput" value="my_voice" spellcheck="false">
    <span class="micro">hold a sustained vowel (“ahhh”) · order-16 LPC · 6 strongest formants</span>
  </div>
  <div class="canvasWrap"><canvas id="plot"></canvas></div>
  <div class="bar">
    <button id="recBtn">● record 2s</button>
    <button id="openBtn">open .wav</button>
    <input id="openFile" type="file" accept="audio/*,.wav" hidden>
    <label class="micro">foundation
      <select id="foundation" style="height:34px;border:1px solid var(--line);background:#fffdf7;font:12px Consolas,monospace">
        <option value="low_hump">low hump</option>
        <option value="sub_shelf">sub shelf</option>
        <option value="808">808 body</option>
        <option value="tube">tube</option>
        <option value="none">none / flat</option>
      </select></label>
    <button id="play">▶ play fit</button><div id="meter"><i></i></div>
    <button class="chip on" data-src="3">voice</button><button class="chip" data-src="0">saw</button>
    <button class="chip" data-src="2">808</button><button class="chip" data-src="1">noise</button>
    <button id="saveBtn">save .body240</button>
  </div>
  <div id="poles" class="micro">record or open a sustained vowel to fit</div>
  <footer id="status">loading…</footer>
</main>
<script type="module" src="js/voice-fit.js?v=voice-20260608"></script>
</body>
</html>
