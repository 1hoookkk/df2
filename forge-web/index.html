<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRENCH · Z-Plane Designer</title>
<meta name="description" content="Trench Z-Plane filter designer: premium, frictionless interactive design surface for 12th-order biquad cascades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0B0B0D;
    --iron: #1A191C;
    --hairline: rgba(86, 82, 76, 0.6);
    --truth: #F2EFE8;
    --ice: #8FE3F0;
    --ember: #C7741F;
    --fault: #E5483C;
    --mono: "Spline Sans Mono", ui-monospace, Consolas, monospace;
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    color: var(--truth);
    font-family: var(--mono);
    font-size: 11px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  
  /* Subtle film grain texture overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: .025;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='1'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #app {
    display: grid;
    grid-template-columns: 1fr 280px;
    grid-template-rows: 40px minmax(0, 1fr) 40px;
    height: 100%;
    grid-template-areas:
      "top top"
      "main side"
      "foot side";
  }

  /* ---- Header Bar ---- */
  #top {
    grid-area: top;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    border-bottom: 1px solid rgba(86, 82, 76, 0.15);
    background: var(--void);
    z-index: 10;
  }
  
  .brand {
    margin: 0;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .2em;
    color: var(--truth);
    text-transform: uppercase;
  }
  
  .brand small {
    color: var(--ice);
    font-weight: 700;
  }

  .nameInput {
    height: 24px;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(86, 82, 76, 0.3);
    color: var(--truth);
    padding: 0;
    font-family: var(--mono);
    font-size: 11px;
    min-width: 140px;
    border-radius: 0;
    letter-spacing: 0.05em;
  }
  .nameInput:focus {
    outline: none;
    border-bottom-color: var(--ice);
  }

  .spacer { flex: 1; }

  .lamp {
    font-size: 9px;
    padding: 4px 10px;
    border: 1px solid var(--hairline);
    border-radius: 1px;
    text-transform: uppercase;
    font-weight: 400;
    letter-spacing: .1em;
    transition: all 0.2s;
    background: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lamp::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .lamp.pass { color: var(--truth); border-color: rgba(242, 239, 232, 0.3); }
  .lamp.pass::before { background: var(--truth); box-shadow: 0 0 4px var(--truth); }
  .lamp.warn { color: var(--ember); border-color: rgba(199, 116, 31, 0.3); }
  .lamp.warn::before { background: var(--ember); box-shadow: 0 0 4px var(--ember); }
  .lamp.fail { color: var(--fault); border-color: rgba(229, 72, 60, 0.3); }
  .lamp.fail::before { background: var(--fault); box-shadow: 0 0 4px var(--fault); }

  button {
    font-family: var(--mono);
    cursor: pointer;
    background: none;
    color: var(--hairline);
    border: 1px solid rgba(86, 82, 76, 0.3);
    border-radius: 2px;
    padding: 4px 10px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .08em;
    transition: all 0.1s ease;
  }
  button:hover {
    border-color: var(--truth);
    color: var(--truth);
  }
  button.primary {
    border-color: var(--ice);
    color: var(--ice);
  }
  button.primary:hover {
    color: var(--void);
    background: var(--ice);
  }

  /* ---- Main Work Canvas Area ---- */
  #main {
    grid-area: main;
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    min-height: 0;
  }
  
  .canvasWrap {
    border: 1px solid rgba(86, 82, 76, 0.15);
    background: var(--void);
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---- Right Sidebar Panel ---- */
  #side {
    grid-area: side;
    border-left: 1px solid rgba(86, 82, 76, 0.15);
    background: var(--void);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    min-height: 0;
  }
  
  .panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .panel h3 {
    margin: 0;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .15em;
    color: var(--hairline);
    text-transform: uppercase;
  }
  
  .controlGroup {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .knob {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  
  .knob label {
    font-size: 9px;
    color: var(--hairline);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    letter-spacing: 0.05em;
  }
  
  .knob label span {
    color: var(--truth);
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    height: 1px;
    background: rgba(86, 82, 76, 0.4);
    outline: none;
    width: 100%;
    margin: 6px 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 6px;
    height: 12px;
    border-radius: 1px;
    background: var(--ice);
    cursor: pointer;
  }

  /* Segmented buttons */
  .segGroup {
    display: flex;
    gap: 4px;
  }
  
  .segBtn {
    flex: 1;
    text-align: center;
    padding: 4px 0;
    font-size: 9px;
    border-radius: 1px;
  }
  .segBtn.active {
    color: var(--ice);
    border-color: var(--ice);
    background: none;
  }

  /* Minimal stage table list */
  .laneList {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 240px;
    overflow-y: auto;
  }
  
  .laneRow {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 4px 0;
    border-bottom: 1px solid rgba(86, 82, 76, 0.1);
    background: none;
    cursor: pointer;
  }
  
  .laneRow.selected {
    border-bottom-color: var(--ice);
  }
  
  .laneRow .index {
    color: var(--hairline);
    font-size: 9px;
  }
  .laneRow.selected .index {
    color: var(--ice);
    font-weight: bold;
  }
  
  .laneRow .role {
    font-size: 9px;
    color: var(--truth);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .laneRow.selected .role {
    color: var(--ice);
  }
  
  .laneRow .vals {
    font-size: 9px;
    color: var(--hairline);
    text-align: right;
    line-height: 1.3;
  }
  .laneRow.selected .vals {
    color: rgba(143, 227, 240, 0.7);
  }
  .laneRow .vals span {
    color: var(--truth);
  }

  /* ---- Audition Footer Bar ---- */
  #foot {
    grid-area: foot;
    border-top: 1px solid rgba(86, 82, 76, 0.15);
    background: var(--void);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 20px;
    z-index: 10;
  }
  
  .auditionWrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .meter {
    width: 60px;
    height: 2px;
    background: rgba(86, 82, 76, 0.2);
    position: relative;
    overflow: hidden;
  }
  .meter i {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: var(--ice);
    transition: width 0.05s linear;
  }
  .meter.flood {
    background: rgba(229, 72, 60, 0.2);
  }
  .meter.flood i {
    background: var(--fault);
  }
  
  #status {
    color: var(--hairline);
    font-size: 10px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-left: auto;
  }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1 class="brand">TRENCH<small>·</small>FORGE</h1>
    <input id="nameInput" class="nameInput" value="vowel_designer" spellcheck="false" autocomplete="off" aria-label="Preset Name">
    <button id="resetBtn">reset</button>
    <div class="spacer"></div>
    <div id="auditLamp" class="lamp pass">pass</div>
    <button id="saveBtn" class="primary">bake .body240</button>
  </header>

  <main id="main">
    <div class="canvasWrap" id="curveWrap">
      <canvas id="curve"></canvas>
    </div>
    <div class="canvasWrap" id="fieldWrap">
      <canvas id="field"></canvas>
    </div>
  </main>

  <aside id="side">
    <div class="panel">
      <h3>morph & Q</h3>
      <div class="controlGroup">
        <div class="knob">
          <label>morph (morph) <span id="morphVal">0.00</span></label>
          <input id="morphSlider" type="range" min="0" max="100" value="0">
        </div>
        <div class="knob">
          <label>Secondary (Q) <span id="qVal">0.00</span></label>
          <input id="qSlider" type="range" min="0" max="100" value="0">
        </div>
      </div>
    </div>
    
    <div class="panel">
      <h3>snap rails</h3>
      <div class="segGroup" id="railSelect">
        <button class="segBtn active" data-rail="measured">measured</button>
        <button class="segBtn" data-rail="12tet">12-tet</button>
        <button class="segBtn" data-rail="free">free</button>
      </div>
    </div>

    <div class="panel">
      <h3>skeletons</h3>
      <div class="segGroup" id="seedSelect" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;">
        <button class="segBtn" data-seed="vow_aah_eee">vow aah/eee</button>
        <button class="segBtn" data-seed="vow_ooh_aah">vow ooh/aah</button>
        <button class="segBtn" data-seed="lpf_megasweep">lpf sweep</button>
        <button class="segBtn" data-seed="rez_violent">rez violent</button>
        <button class="segBtn" data-seed="eq_acidbass">eq acidbass</button>
        <button class="segBtn" data-seed="pha_gargle">pha gargle</button>
        <button class="segBtn" data-seed="bpf_contrary">bpf contrary</button>
        <button class="segBtn" data-seed="blank">blank</button>
      </div>
    </div>

    <div class="panel" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <h3>six stages</h3>
      <div class="laneList" id="laneList"></div>
    </div>
  </aside>

  <footer id="foot">
    <div class="auditionWrap">
      <button id="playBtn">▶ play</button>
      <div class="meter" id="meter"><i></i></div>
      <div class="segGroup" style="gap: 2px;">
        <button class="segBtn active" data-src="0" style="padding: 3px 6px; font-size: 8px;">saw</button>
        <button class="segBtn" data-src="1" style="padding: 3px 6px; font-size: 8px;">noise</button>
        <button class="segBtn" data-src="2" style="padding: 3px 6px; font-size: 8px;">808</button>
        <button class="segBtn" data-src="3" style="padding: 3px 6px; font-size: 8px;">voice</button>
      </div>
    </div>
    <div class="knob" style="width: 140px; margin-left: 10px;">
      <label style="font-size: 9px;">Mackie saturation <span id="driveVal">40</span></label>
      <input id="driveSlider" type="range" min="0" max="100" value="40">
    </div>
    <span id="status">idle</span>
  </footer>
</div>
<script type="module" src="js/forge.js?v=m50q50"></script>
</body>
</html>
