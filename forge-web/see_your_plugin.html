<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>See Your Plugin — x-ray (builder tool)</title>
<style>
  :root { --bg:#15161a; --ink:#cfe9ef; --cyan:#5fd6e6; --dim:#7f8a90; --ok:#7fe6a7; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
              font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { display:flex; gap:22px; padding:20px; align-items:flex-start; }
  canvas { background:#000; border:1px solid #2a2c33; cursor:crosshair; }
  .side { width:300px; }
  h1 { font-size:13px; margin:0 0 4px; color:var(--cyan); letter-spacing:.05em; }
  .sub { color:var(--dim); margin:0 0 16px; font-size:12px; }
  .card { background:#1b1d23; border:1px solid #2a2c33; border-radius:8px; padding:14px; min-height:150px; }
  .ctl { font-size:15px; color:var(--cyan); margin:0 0 8px; }
  .coords { font:12px/1.6 monospace; color:var(--ink); margin:0 0 10px; }
  .coords b { color:var(--cyan); }
  .chain { list-style:none; margin:8px 0 0; padding:8px 0 0; border-top:1px solid #2a2c33; }
  .chain li { padding:4px 0 4px 18px; position:relative; }
  .chain li::before { content:"↓"; position:absolute; left:2px; color:var(--dim); }
  .chain li:first-child::before { content:"●"; color:var(--cyan); font-size:10px; top:7px; }
  .locked { color:var(--dim); }
  .tag { font-size:10px; color:#0e0f12; background:var(--cyan); border-radius:3px; padding:1px 5px; margin-left:6px; }
  .tag.read { background:#3a3d46; color:var(--ink); }
  .status { margin-top:10px; font-size:12px; color:var(--ok); min-height:16px; }
  .empty { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <div><canvas id="c" width="720" height="1120"></canvas></div>
  <div class="side">
    <h1>SEE YOUR PLUGIN — x-ray</h1>
    <p class="sub">drag a control to move it · coords show here, never on the art · drops write the real ui_layout.json</p>
    <div class="card" id="card"><p class="empty">Hover a control… drag to move it.</p></div>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
const SRC_W=1024, SRC_H=1591, ED_W=360, ED_H=560, DISP=2;
const c=document.getElementById('c'), g=c.getContext('2d');
const sx=x=>x*ED_W/SRC_W*DISP, sy=y=>y*ED_H/SRC_H*DISP;
const dsx=d=>d/DISP*SRC_W/ED_W, dsy=d=>d/DISP*SRC_H/ED_H;

const rects = {
  morphWheel:[127,694,423,101], qWheel:[127,871,423,101],
  typeSelector:[230,142,672,73], morphReadout:[603,712,168,77], qReadout:[602,889,169,79],
};
const wiring = {
  morphWheel:  {name:'Morph wheel', tag:'control', chain:['morph parameter','smoothed','blend across the 4 corners','the 6 DF2T stages','audio out']},
  qWheel:      {name:'Q wheel', tag:'control', chain:['q (Secondary) parameter','smoothed','blend on the Q axis','stage pole-radii','audio out']},
  typeSelector:{name:'Type selector', tag:'control', chain:['body parameter','loads the 240-byte body','which defines the 4 corners']},
  morphReadout:{name:'Morph readout', tag:'read-only', chain:['displays the morph value']},
  qReadout:    {name:'Q readout', tag:'read-only', chain:['displays the q value']},
};

let hovered=null, selected=null, dragging=false, startMouse=null, startRect=null, guideX=null, guideY=null;
const panel=new Image(); panel.onload=draw; panel.src='../juce-shell/assets/ui/df2_panel_shadow.png';
const dispRect=id=>{const [x,y,w,h]=rects[id];return [sx(x),sy(y),sx(w),sy(h)];};

function draw(){
  g.clearRect(0,0,c.width,c.height);
  if(panel.complete&&panel.naturalWidth) g.drawImage(panel,0,0,c.width,c.height);
  const lit = selected||hovered;
  if(lit){
    const [x,y,w,h]=dispRect(lit);
    g.save(); g.shadowColor='rgba(95,214,230,.9)'; g.shadowBlur=14;
    g.strokeStyle='#5fd6e6'; g.lineWidth=2; g.strokeRect(x,y,w,h); g.restore();
  }
  g.strokeStyle='rgba(232,90,208,.85)'; g.lineWidth=1;
  if(guideX!==null){const px=sx(guideX); g.beginPath(); g.moveTo(px,0); g.lineTo(px,c.height); g.stroke();}
  if(guideY!==null){const py=sy(guideY); g.beginPath(); g.moveTo(0,py); g.lineTo(c.width,py); g.stroke();}
}

function hit(mx,my){
  for(const id of Object.keys(rects)){const [x,y,w,h]=dispRect(id); if(mx>=x&&mx<=x+w&&my>=y&&my<=y+h) return id;}
  return null;
}
function snap(r){
  const others=Object.keys(rects).filter(i=>i!==selected).map(i=>rects[i]);
  const cx=[r[0],r[0]+r[2]/2,r[0]+r[2]], cy=[r[1],r[1]+r[3]/2,r[1]+r[3]];
  let bdx=8,ox=0,gx=null,bdy=8,oy=0,gy=null;
  for(const o of others){
    const oX=[o[0],o[0]+o[2]/2,o[0]+o[2]], oY=[o[1],o[1]+o[3]/2,o[1]+o[3]];
    for(const a of cx)for(const b of oX){const d=Math.abs(a-b); if(d<=bdx){bdx=d;ox=b-a;gx=b;}}
    for(const a of cy)for(const b of oY){const d=Math.abs(a-b); if(d<=bdy){bdy=d;oy=b-a;gy=b;}}
  }
  guideX=gx; guideY=gy; return [r[0]+ox,r[1]+oy,r[2],r[3]];
}

function card(id, editing){
  const el=document.getElementById('card');
  if(!id){ el.innerHTML='<p class="empty">Hover a control… drag to move it.</p>'; return; }
  const w=wiring[id], r=rects[id].map(Math.round);
  const tagCls=w.tag==='read-only'?'tag read':'tag';
  const coords = editing ? `<div class="coords">x <b>${r[0]}</b>  y <b>${r[1]}</b>  w <b>${r[2]}</b>  h <b>${r[3]}</b></div>` : '';
  const items=w.chain.map(s=>{
    const locked=(s.includes('stage')||s.includes('corners')||s.includes('body'))?' class="locked"':'';
    return `<li${locked}>${s}</li>`;
  }).join('');
  el.innerHTML=`<div class="ctl">${w.name}<span class="${tagCls}">${w.tag}</span></div>${coords}<ul class="chain">${items}</ul>`;
}

c.addEventListener('mousedown',e=>{
  const b=c.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
  selected=hit(mx,my); dragging=!!selected;
  if(selected){ startMouse=[mx,my]; startRect=rects[selected].slice(); document.getElementById('status').textContent=''; }
  draw(); card(selected, !!selected);
});
c.addEventListener('mousemove',e=>{
  const b=c.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
  if(dragging){
    rects[selected]=snap([startRect[0]+dsx(mx-startMouse[0]), startRect[1]+dsy(my-startMouse[1]), startRect[2], startRect[3]]);
    draw(); card(selected, true); return;
  }
  const id=hit(mx,my);
  if(id!==hovered){ hovered=id; draw(); if(!selected) card(id,false); }
});
window.addEventListener('mouseup',async()=>{
  if(!dragging) return;
  dragging=false; guideX=guideY=null; draw();
  const elements={}; for(const id of Object.keys(rects)) elements[id]={rect:rects[id].map(v=>Math.round(v))};
  try{
    const res=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({version:1,sourceSpace:[SRC_W,SRC_H],elements})});
    const j=await res.json();
    document.getElementById('status').textContent = j.ok ? '✓ written — plugin will reload' : 'save failed: '+j.error;
  }catch(err){ document.getElementById('status').textContent='save failed: '+err.message; }
});

window.addEventListener('load',()=>{ selected='morphWheel'; draw(); card('morphWheel', true); });
</script>
</body>
</html>
