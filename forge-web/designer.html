<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>df2 — Filter Designer</title>
<link rel="stylesheet" href="css/basic.css">
<style>
  .dz{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(300px,1fr) auto auto 18px;gap:10px}
  .top{min-height:40px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .nameInput{height:28px;min-width:150px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 8px}
  .micro{font:11px Consolas,monospace;color:var(--muted)}
  /* lanes */
  .lanes{grid-column:1/3;display:grid;gap:5px}
  .lane{display:grid;grid-template-columns:46px 92px 1fr 1fr 64px;gap:7px;align-items:center;
    border:1px solid var(--line);background:#fffdf7;padding:5px 7px;font:11px Consolas,monospace}
  .lane.leader{border-color:var(--hot,#c52f4d);box-shadow:inset 0 0 0 1px var(--hot,#c52f4d)}
  .lane b{font:700 11px Arial;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .lane select,.lane input{font:11px Consolas,monospace;background:#fff;border:1px solid var(--line);height:26px}
  .lane label{display:flex;flex-direction:column;gap:1px;color:var(--muted)}
  .lane label span{font-size:9px;text-transform:uppercase;letter-spacing:.05em}
  .lane input[type=range]{height:18px;padding:0}
  /* plot */
  .plotShell{grid-column:1;position:relative}
  #plot{width:100%;height:100%;display:block;min-height:300px}
  .moves{display:flex;gap:14px;padding:8px 4px 0;flex-wrap:wrap}
  .moves label{display:flex;gap:6px;align-items:center;font:11px Consolas,monospace}
  .moves input[type=range]{width:150px}
  /* gauge */
  .gauge{grid-column:2;border:1px solid var(--ink);background:var(--panel);padding:10px;display:grid;gap:7px;align-content:start}
  .gauge h4{margin:0;font:700 11px Arial;text-transform:uppercase;letter-spacing:.06em}
  .grow{display:grid;grid-template-columns:84px 1fr 54px;gap:6px;align-items:center;font:11px Consolas,monospace}
  .bar{height:12px;border:1px solid var(--line);background:#efe9dc;position:relative;overflow:hidden}
  .bar>i{position:absolute;top:0;bottom:0;background:#5ba35a}
  .grow.bad .bar>i{background:var(--bad,#c52f4d)}
  .grow.bad{color:var(--bad,#c52f4d)}
  .verdict{margin-top:4px;font:700 13px Arial;text-align:center;padding:6px;border:1px solid var(--line)}
  .verdict.in{background:#eef7ea;border-color:#5ba35a;color:#2f6b2f}
  .verdict.out{background:#fbeeee;border-color:var(--bad,#c52f4d);color:var(--bad,#c52f4d)}
  /* transport */
  .transport{grid-column:1/3;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .transport button,.chip{height:32px;border:1px solid var(--line);background:#fffdf7;color:var(--ink);padding:0 12px;cursor:pointer;font:12px Consolas,monospace}
  #play.on{background:var(--hot,#c52f4d);color:#fff;border-color:var(--hot,#c52f4d)}
  .chip.on{background:var(--ink);color:#fffdf7}
  #meter{width:90px;height:13px;border:1px solid var(--line);background:#efe9dc;position:relative;overflow:hidden}
  #meter>i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#5ba35a}
  #meter.flood{outline:2px solid var(--bad,#c52f4d)} #meter.flood>i{background:var(--bad,#c52f4d)}
  .propose{font-weight:700}
  @media(max-width:900px){.dz{grid-template-columns:1fr}.plotShell,.gauge,.transport,.lanes,.top{grid-column:1}.lane{grid-template-columns:42px 84px 1fr 1fr 56px}}
</style>
</head>
<body>
<main class="forge dz">
  <header class="top">
    <div class="brand">df2 · Designer</div>
    <input id="nameInput" class="nameInput" value="designed_body" spellcheck="false" autocomplete="off">
    <span class="micro">six typed section lanes · start on a real rail · move in octaves · the corridor keeps you honest</span>
    <div id="light" class="light"></div>
  </header>

  <section class="lanes" id="lanes"></section>

  <section class="plotShell">
    <canvas id="plot"></canvas>
    <div class="moves">
      <label>Morph <output id="mOut">0</output><input id="morph" type="range" min="0" max="100" value="0"></label>
      <label>Drive <output id="dOut">40</output><input id="drive" type="range" min="0" max="100" value="40"></label>
    </div>
  </section>

  <aside class="gauge">
    <h4>iconic corridor</h4>
    <div id="gaugeBody"></div>
    <div id="verdict" class="verdict">—</div>
    <span class="micro">green = in the neighborhood of the real iconic bodies. it does not pick for you.</span>
  </aside>

  <section class="transport">
    <button id="play">▶ play</button>
    <div id="meter"><i></i></div>
    <button class="chip on" data-src="2">808</button>
    <button class="chip" data-src="0">saw</button>
    <button class="chip" data-src="3">voice</button>
    <button class="chip" data-src="1">noise</button>
    <button id="proposeBtn" class="propose">✦ propose in corridor</button>
    <button id="saveBtn">save .body240</button>
  </section>

  <footer id="status">loading…</footer>
</main>
<script type="module" src="js/designer.js?v=designer-20260608"></script>
</body>
</html>
