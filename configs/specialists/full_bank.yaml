      vowel_oo_to_ee: {start_hz: [300.0, 870.0, 2240.0], move_oct: [-0.15, 1.40, 0.43]}
      vowel_ah_to_ee: {start_hz: [730.0, 1090.0, 2440.0], move_oct: [-1.44, 1.07, 0.30]}
      vowel_eh_to_ee: {start_hz: [530.0, 1840.0, 2480.0], move_oct: [-0.97, 0.32, 0.28]}
      vowel_ao_to_ee: {start_hz: [570.0, 840.0, 2410.0], move_oct: [-1.08, 1.45, 0.32]}
      vowel_ee_to_ah: {start_hz: [270.0, 2290.0, 3010.0], move_oct: [1.44, -1.07, -0.30]}
      vowel_ae_to_ee: {start_hz: [660.0, 1720.0, 2410.0], move_oct: [-1.29, 0.41, 0.32]}
      vowel_oo_to_ah: {start_hz: [300.0, 870.0, 2240.0], move_oct: [1.28, 0.33, 0.12]}
      vowel_uh_to_ee: {start_hz: [640.0, 1190.0, 2390.0], move_oct: [-1.25, 0.95, 0.33]}
