# wild.yaml — reins OFF. Same QD engine, but the creative envelope is blown open
# and the gate is dropped to a STABILITY + SANITY floor (stable, finite, and it
# at least MOVES a little). Everything aesthetic — span, peaks, scream, drama — is
# handed back to the EAR. The corridor gate (overnight.yaml) stays as the calibrated
# reference; this one is for finding the bold/weird edges the corridor clipped.
name: wild_open
iterations: 80000
search_grid_steps: 5
final_grid_steps: 17
require_full_specialist_coverage: false
keepers_per_specialist: 1
families:
  - opposed_window
  - vocal_mountains
  - lp6_tear
  - shelf_crossing

generation:
  frequency_hz: [40.0, 18000.0]            # full audible (was 90–15000)
  pole_radius_q0: [0.920, 0.9970]          # broad → tight (was 0.975–0.994)
  pole_radius_q100: [0.9950, 0.999850]     # up toward the rim for scream (was 0.9982–0.99965)
  zero_radius_q0: [0.850, 0.99950]         # wide-open zeros (was 0.93–0.998)
  zero_radius_q100: [0.9850, 0.999970]
  morph_motion_octaves: [0.10, 3.50]       # tiny → huge sweeps (was 0.25–1.65)
  zero_counter_motion_octaves: [0.20, 4.00]
  secondary_shift_octaves: [0.0, 1.20]     # let Q actually do something (was 0.0–0.55)
  constructor_jitter_octaves: [-0.55, 0.55]
  local_zero_offset_octaves: [-0.90, 0.90]
  global_zero_offset_octaves: [-2.50, 2.50]
  secondary_pole_scale: 0.60               # (was 0.35)
  opposed_window:
    bases_hz: [120.0, 320.0, 760.0, 1700.0, 4000.0, 9500.0]
  vocal_mountains:
    bases_hz: [180.0, 480.0, 1000.0, 2200.0, 4200.0, 8200.0]
    contrary_indices: [1, 2, 4, 5]
    local_indices: [1, 2, 4]
  lp6_tear:
    cutoff_start_hz: [2200.0, 12000.0]
    cutoff_end_hz: [240.0, 2600.0]
    secondary_pole_octaves: [-0.60, 0.30]
    section_q: [0.51764, 0.70711, 1.41421, 1.93185, 2.61313]
    actor_bases_hz: [280.0, 1450.0, 5200.0]
  shelf_crossing:
    lowshelf:
      pole_start_hz: [110.0, 640.0]
      pole_end_hz: [420.0, 2000.0]
      gain_start_db: [-24.0, 18.0]
      gain_end_db: [10.0, 30.0]
      secondary_gain_db: [-16.0, 16.0]
    highshelf:
      pole_start_hz: [1500.0, 6500.0]
      pole_end_hz: [3600.0, 13000.0]
      gain_start_db: [-30.0, 12.0]
      gain_end_db: [6.0, 30.0]
      secondary_gain_db: [-16.0, 16.0]
    actor_bases_hz: [360.0, 1050.0, 2600.0, 6600.0]
    actor_local_indices: [0, 2]

gates:
  # STABILITY + SANITY floor only. Stable, finite, and it moves a little — the EAR does the rest.
  maximum_pole_radius: 0.99997          # hard stability ceiling (must stay < 1.0)
  minimum_ceiling_radius: 0.90          # don't require a hot pole — tame-Q bodies allowed
  minimum_center_span_db: 12.0          # nearly-anything, just not dead-flat
  minimum_endpoint_span_db: 18.0
  maximum_span_db: 400.0                # allow extreme span
  minimum_morph_contrast_db: 3.0        # it has to move SOMETHING (ear judges how much)
  minimum_secondary_contrast_db: 0.0    # Q can do nothing or everything
  minimum_center_peaks: 0
  minimum_center_valleys: 0
  minimum_leader_zero_motion_octaves: 0.0   # leader-sweep requirement DROPPED
  minimum_leader_pole_motion_octaves: 0.0
  reference_endpoint_span_ratio: 0.0
  reference_morph_contrast_ratio: 0.0
  reference_secondary_contrast_ratio: 0.0

archive:
  # widened bins to capture the bigger span/motion space the open envelope reaches
  span_bins: [40.0, 80.0, 130.0, 200.0, 300.0]
  motion_bins: [10.0, 25.0, 50.0, 90.0]
  complexity_bins: [3.0, 6.0, 9.0]
  zero_motion_bins: [0.2, 0.7, 1.5, 3.0]
