# clean_wave_landed.yaml — the anti-"random loud peaks" wave.
# Corridor gates (the moderate iconic envelope, NOT the extreme template direction)
# + three musicality locks:
#   1. land_peaks_on_notes: every resonant peak lands on a 12-TET note at both
#      frames (verified 0.000 cents); Q is radius-only so peaks stay on pitch.
#   2. bases swapped to the MEASURED P2K rails (frequency_rails.csv — mouth 780,
#      vowel-aa 1090, tear 3790/4130, air 8250, etc.) so peaks sit on formant
#      structure, not random frequencies. Small constructor jitter keeps them there.
#   3. Q capped below the white-noise-scream threshold (q100 <= 0.9986, Q ~360 —
#      blooms hard but doesn't shriek) and frequency pulled out of the harsh
#      12-18k spike zone (top 12 kHz, bottom 50 Hz).
name: clean_wave_landed
iterations: 30000
search_grid_steps: 5
final_grid_steps: 17
require_full_specialist_coverage: false
keepers_per_specialist: 1
families:
  - opposed_window
  - vocal_mountains
  - lp6_tear
  - shelf_crossing

generation:
  frequency_hz: [50.0, 12000.0]
  pole_radius_q0: [0.965, 0.992]
  pole_radius_q100: [0.9970, 0.9986]        # blooms (Q ~180-360), does NOT scream to white noise
  zero_radius_q0: [0.90, 0.992]
  zero_radius_q100: [0.985, 0.9992]
  morph_motion_octaves: [0.25, 1.65]        # musical glide, not insane sweeps
  zero_counter_motion_octaves: [0.45, 2.00]
  secondary_shift_octaves: [0.0, 0.45]
  constructor_jitter_octaves: [-0.10, 0.10] # small — stay on the rails
  local_zero_offset_octaves: [-0.40, 0.40]
  global_zero_offset_octaves: [-1.0, 1.0]
  secondary_pole_scale: 0.35
  land_peaks_on_notes: true
  opposed_window:
    bases_hz: [134.0, 450.0, 780.0, 2220.0, 4130.0, 8250.0]   # measured rails (sub→air)
  vocal_mountains:
    bases_hz: [200.0, 545.0, 1090.0, 2840.0, 4440.0, 9650.0]  # measured rails (vowel triangle)
    contrary_indices: [1, 2, 4, 5]
    local_indices: [1, 2, 4]
  lp6_tear:
    cutoff_start_hz: [2200.0, 9000.0]
    cutoff_end_hz: [300.0, 2200.0]
    secondary_pole_octaves: [-0.35, 0.12]
    section_q: [0.51764, 0.70711, 1.41421, 1.93185]
    actor_bases_hz: [365.0, 780.0, 2220.0, 4130.0]            # rails
  shelf_crossing:
    lowshelf:
      pole_start_hz: [134.0, 545.0]
      pole_end_hz: [450.0, 1420.0]
      gain_start_db: [-18.0, 12.0]
      gain_end_db: [12.0, 24.0]
      secondary_gain_db: [-10.0, 10.0]
    highshelf:
      pole_start_hz: [2220.0, 5450.0]
      pole_end_hz: [4130.0, 9650.0]
      gain_start_db: [-24.0, 8.0]
      gain_end_db: [8.0, 24.0]
      secondary_gain_db: [-10.0, 10.0]
    actor_bases_hz: [450.0, 1090.0, 2840.0, 8250.0]           # rails
    actor_local_indices: [0, 2]

gates:
  # corridor (iconic-15 calibrated) — moderate iconic envelope; rejects extreme/template
  maximum_pole_radius: 0.99900
  minimum_ceiling_radius: 0.983
  minimum_center_span_db: 40.0
  minimum_endpoint_span_db: 54.0
  maximum_span_db: 150.0
  minimum_morph_contrast_db: 8.0
  minimum_secondary_contrast_db: 5.7
  minimum_center_peaks: 1
  minimum_center_valleys: 0
  minimum_leader_zero_motion_octaves: 0.9
  minimum_leader_pole_motion_octaves: 0.9
  reference_endpoint_span_ratio: 0.0
  reference_morph_contrast_ratio: 0.0
  reference_secondary_contrast_ratio: 0.0

archive:
  span_bins: [72.0, 100.0, 140.0, 190.0, 240.0]
  motion_bins: [15.0, 28.0, 44.0, 64.0]
  complexity_bins: [4.0, 6.0, 8.0]
  zero_motion_bins: [0.25, 0.65, 1.0, 1.5]
