# overnight.yaml — v1's QD search engine, gated by the ICONIC CORRIDOR (not the
# bent v1 gates). Built 2026-06-08 after validating the corridor gate against the
# real P2K references (iconic-15: 15/15 pass, full-50: 30/50). The v1.yaml gates
# are the documented fantasy set (secondary>=17, maxR>=0.998, median zero-travel)
# that rejected 0/50 iconic bodies — see memory iconic-corridor-and-the-bent-audit.
#
# Generation ranges are identical to v1; only the GATES + ARCHIVE bins are the
# corridor ones (mirrored from smoke.yaml), coverage is not required (so a long
# run always writes its archive + keepers), and iterations are sized for a night.
name: overnight_corridor
iterations: 80000
search_grid_steps: 5
final_grid_steps: 17
require_full_specialist_coverage: false
keepers_per_specialist: 1
families:
  - opposed_window
  - vocal_mountains
  - lp6_tear
  - shelf_crossing

generation:
  frequency_hz: [90.0, 15000.0]
  pole_radius_q0: [0.975, 0.994]
  pole_radius_q100: [0.9982, 0.99965]
  zero_radius_q0: [0.93, 0.998]
  zero_radius_q100: [0.992, 0.99995]
  morph_motion_octaves: [0.25, 1.65]
  zero_counter_motion_octaves: [0.45, 2.30]
  secondary_shift_octaves: [0.0, 0.55]
  constructor_jitter_octaves: [-0.24, 0.24]
  local_zero_offset_octaves: [-0.45, 0.45]
  global_zero_offset_octaves: [-1.5, 1.5]
  secondary_pole_scale: 0.35
  opposed_window:
    bases_hz: [170.0, 420.0, 900.0, 1900.0, 4300.0, 8800.0]
  vocal_mountains:
    bases_hz: [240.0, 530.0, 1050.0, 2100.0, 3900.0, 7100.0]
    contrary_indices: [1, 2, 4, 5]
    local_indices: [1, 2, 4]
  lp6_tear:
    cutoff_start_hz: [2800.0, 9000.0]
    cutoff_end_hz: [380.0, 2100.0]
    secondary_pole_octaves: [-0.35, 0.12]
    section_q: [0.51764, 0.70711, 1.93185]
    actor_bases_hz: [360.0, 1450.0, 5200.0]
  shelf_crossing:
    lowshelf:
      pole_start_hz: [140.0, 520.0]
      pole_end_hz: [500.0, 1600.0]
      gain_start_db: [-18.0, 12.0]
      gain_end_db: [12.0, 24.0]
      secondary_gain_db: [-10.0, 10.0]
    highshelf:
      pole_start_hz: [1800.0, 5200.0]
      pole_end_hz: [4200.0, 11000.0]
      gain_start_db: [-24.0, 8.0]
      gain_end_db: [8.0, 24.0]
      secondary_gain_db: [-10.0, 10.0]
    actor_bases_hz: [420.0, 1150.0, 2800.0, 6600.0]
    actor_local_indices: [0, 2]

gates:
  # MIRRORED FROM configs/model/smoke.yaml — the iconic-15 corridor (15/15 pass).
  maximum_pole_radius: 0.99990
  minimum_ceiling_radius: 0.983
  minimum_center_span_db: 40.0
  minimum_endpoint_span_db: 54.0
  maximum_span_db: 150.0
  minimum_morph_contrast_db: 8.0
  minimum_secondary_contrast_db: 5.7  # Q-bloom correction 2026-06-09 (mirrors smoke.yaml; old 0.25 was the bent ruler)
  minimum_center_peaks: 1
  minimum_center_valleys: 0
  minimum_leader_zero_motion_octaves: 0.9
  minimum_leader_pole_motion_octaves: 0.9
  reference_endpoint_span_ratio: 0.0
  reference_morph_contrast_ratio: 0.0
  reference_secondary_contrast_ratio: 0.0

archive:
  span_bins: [72.0, 100.0, 140.0, 190.0, 240.0]
  motion_bins: [15.0, 28.0, 44.0, 64.0]
  complexity_bins: [4.0, 6.0, 8.0]
  zero_motion_bins: [0.25, 0.65, 1.0, 1.5]
