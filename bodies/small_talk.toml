# Small Talk — vowel morph, Ah ↔ Ee with bite
# Universal vocabulary: Root / Body / Mouth / Scar / Edge / Rip
#
# Vocal anatomy mapping for this body:
#   Body  = F1 (throat / jaw opening)
#   Mouth = F2 (tongue position front↔back)
#   Edge  = F3 (face / presence)
#   Scar  = anti-formant notch (inter-formant valley)
#   Root  = chest weight (sub)
#   Rip   = air / breath shelf
#
# Formant targets (Peterson–Barney 1952 / Hillenbrand 1995, averaged):
#   Ah  : F1=730   F2=1090  F3=2440
#   Ee  : F1=270   F2=2290  F3=3010
#
# Zeros placed an octave above each formant pole (resonator+zero) →
# asymmetric peak with sharp HF rolloff = bite without harshness.
# Scar slot is a TRUE notch (zero on pole, unit radius) at the
# vowel-appropriate inter-formant valley.
#
# M axis : vowel position           (M0 = Ah,   M100 = Ee)
# Q axis : breathiness ↔ definition (Q0 = soft, Q100 = sharp)

name        = "Small Talk"
boost       = 3.0
filter_type = 0

[vocabulary]
slot_0 = { label = "Root",  desc = "chest weight (sub)"       }
slot_1 = { label = "Body",  desc = "F1 — throat / jaw"        }
slot_2 = { label = "Mouth", desc = "F2 — tongue position"     }
slot_3 = { label = "Scar",  desc = "anti-formant notch"       }
slot_4 = { label = "Edge",  desc = "F3 — face / presence"     }
slot_5 = { label = "Rip",   desc = "air / breath shelf"       }

# ─── M0_Q0  ─  Ah, soft  ───────────────────────────────────────────────
[[corner.M0_Q0.stages]]    # Root
type     = "resonator"
freq_hz  = 80.0
radius   = 0.88
val1     = 0.0
[[corner.M0_Q0.stages]]    # Body / F1 = 730 (Ah)
type          = "resonator_with_zero"
freq_hz       = 730.0
radius        = 0.93
val1          = 0.0
zero_freq_hz  = 1460.0
zero_radius   = 0.85
[[corner.M0_Q0.stages]]    # Mouth / F2 = 1090 (Ah)
type          = "resonator_with_zero"
freq_hz       = 1090.0
radius        = 0.92
val1          = 0.0
zero_freq_hz  = 2180.0
zero_radius   = 0.85
[[corner.M0_Q0.stages]]    # Scar / anti-formant notch (Ah valley ~1700)
type          = "resonator_with_zero"
freq_hz       = 1700.0
radius        = 0.70
val1          = 0.0
zero_freq_hz  = 1700.0
zero_radius   = 1.0
[[corner.M0_Q0.stages]]    # Edge / F3 = 2440 (Ah)
