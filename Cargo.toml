[workspace]
members = ["trench-core", "forge-clean", "forge-gpu-painter", "forge-zero"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# the painter's solver + paint loops are hot; opt-level 1 reads as UI jank
[profile.dev.package.forge-gpu-painter]
opt-level = 3

# `package."*"` skips workspace members, so trench-core (pack_body, word lerp,
# cascade |H|, the 17x17 audit, the audio engine — all the painter's hot math)
# was compiling at opt-level 1 in dev runs
[profile.dev.package.trench-core]
opt-level = 3
