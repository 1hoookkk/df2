<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>forge — vocal move + loop player</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#04060a;--field:#06090e;--panel:#090d13;--panel2:#0c121a;--hair:#16221c;--grid:#0e1c15;
  --ink:#bfd8c6;--ink2:#5d7064;--dim:#374a3f;--green:#5dff77;--amber:#e8a93c;--orange:#e8742e;--red:#e0473e;--blue:#4aa6df;--teal:#2fd6c4;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"DM Mono",ui-monospace,monospace;padding:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
.arch{font-family:"Archivo";font-weight:800}
.lab{font-size:9px;letter-spacing:1.3px;color:var(--ink2);text-transform:uppercase}
.app{height:calc(100vh - 26px);display:grid;grid-template-rows:auto auto auto 1fr auto;gap:9px;max-width:1330px;margin:0 auto}
.flow{display:flex;align-items:center;gap:7px;font-family:"Archivo";font-weight:800;font-size:10.5px}
.flow b{padding:5px 10px;border-radius:6px;border:1.5px solid var(--hair);color:var(--dim)}
.flow b.on{border-color:var(--green);color:var(--green);box-shadow:0 0 14px -5px var(--green)}
.flow span{color:var(--dim)}
.head{display:flex;align-items:center;gap:12px}
.head h1{font-family:"Archivo";font-weight:900;font-size:17px}
.head .verdict{font-size:10px;color:var(--ink2);max-width:540px;line-height:1.35}
.head .verdict b{color:var(--green)}
.spacer{flex:1}
.kk{font-family:"Archivo";font-weight:800;font-size:10.5px;padding:7px 12px;border-radius:7px;border:1.5px solid var(--hair);cursor:pointer;background:var(--panel)}
.kk.kill{color:var(--red)} .kk.bake{color:var(--green);border-color:var(--green);box-shadow:0 0 14px -5px var(--green)}
.skins{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.skins .sl{font-family:"Archivo";font-weight:800;font-size:9.5px;color:var(--ink2);margin-right:2px}
.skin{font-family:"Archivo";font-weight:700;font-size:10px;padding:6px 10px;border-radius:6px;border:1.5px solid var(--hair);color:var(--ink2);cursor:pointer;background:var(--panel)}
.skin.on{border-color:var(--green);color:var(--green);box-shadow:0 0 12px -5px var(--green)}

.main{display:grid;grid-template-columns:1fr 240px;gap:9px;min-height:0}
.col{display:flex;flex-direction:column;gap:9px;min-height:0}
.card{background:var(--panel);border:1.5px solid var(--hair);border-radius:10px;position:relative}
.hero{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(130% 100% at 50% 100%,rgba(45,191,75,.05),transparent 65%),var(--field)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.htag{position:absolute;top:8px;left:11px;font-size:9.5px;color:var(--ink2);z-index:5;pointer-events:none}
.htag b{color:var(--green)}
.freqax{position:absolute;left:0;right:0;bottom:15px;height:11px;z-index:4;pointer-events:none}
.freqax span{position:absolute;transform:translateX(-50%);font-size:8px;color:var(--ink2)}
.anchorstrip{position:absolute;left:0;right:0;bottom:2px;height:11px;z-index:4;pointer-events:none}
.anchorstrip .ab{position:absolute;transform:translateX(-50%);bottom:0;font-size:7.5px;color:#475a4e;letter-spacing:.5px}
.tlwrap{flex:1;display:flex;flex-direction:column;gap:1px}
.ruler{position:relative;height:11px}
.ruler .tk{position:absolute;top:0;width:1px;height:4px;background:var(--hair)}
.ruler .tn{position:absolute;top:4px;transform:translateX(-50%);font-size:8px;color:var(--ink2)}
.pnode{position:absolute;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.pnode .t{width:16px;height:16px;border-radius:5px;border:2px solid;display:flex;align-items:center;justify-content:center;font-family:"Archivo";font-weight:900;font-size:8.5px;background:var(--field)}
.pcall{position:absolute;transform:translate(-50%,-100%);background:#03130a;border:1px solid var(--green);color:var(--ink);font-size:9px;padding:2px 6px;border-radius:5px;white-space:nowrap;z-index:7}
.pcall b{color:var(--green);font-family:"Archivo";font-weight:800}

/* transport */
.transport{padding:8px 11px;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:9px}
.play{width:32px;height:32px;border-radius:50%;border:2px solid var(--green);background:var(--green);color:#03130a;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;flex:none}
.tbtn{font-family:"Archivo";font-weight:700;font-size:10px;padding:6px 10px;border-radius:6px;border:1.5px solid var(--hair);color:var(--ink2);cursor:pointer;background:var(--panel2)}
.tbtn.on{border-color:var(--green);color:var(--green)}
.tin{width:46px;background:var(--field);border:1.5px solid var(--hair);border-radius:5px;color:var(--green);font-family:"DM Mono";font-size:11px;padding:5px 6px;text-align:center}
select.tin{width:58px;color:var(--ink)}
.matsel{width:auto;min-width:120px;text-align:left;font-family:"Archivo";font-weight:700;font-size:10px}
.matsel.on{border-color:var(--green);color:var(--green)}
.tlab{font-size:9px;color:var(--ink2)}
.timeline{flex:1;height:18px;position:relative;border:1.5px solid var(--hair);border-radius:6px;background:linear-gradient(90deg,var(--grid),var(--panel2));cursor:pointer}
.region{position:absolute;top:0;bottom:0;background:rgba(93,255,119,.12);border-left:2px solid var(--green);border-right:2px solid var(--orange)}
.thandle{position:absolute;top:-3px;width:9px;height:24px;border-radius:3px;transform:translateX(-50%);cursor:ew-resize;z-index:3}
.thandle.in{background:var(--green)} .thandle.out{background:var(--orange)}
.playhead{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;box-shadow:0 0 6px #fff;z-index:4;pointer-events:none}
.snaps{display:flex;gap:5px}
.snap{font-family:"Archivo";font-weight:700;font-size:8.5px;padding:5px 7px;border-radius:5px;border:1.5px solid var(--hair);color:var(--ink2);cursor:pointer;background:var(--panel2)}
.snap.on{border-color:var(--green);color:var(--green)}
.pushrow{display:flex;align-items:center;gap:8px}
.pushrow .pl{font-family:"Archivo";font-weight:800;font-size:10px;width:42px;color:var(--blue)}
.pslide{flex:1;height:9px;border-radius:5px;background:var(--grid);position:relative;border:1px solid var(--hair);cursor:pointer;max-width:150px}
.pslide .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--blue)}
.pslide .k{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--field);border:2px solid var(--blue);transform:translate(-50%,-50%)}
.verb{font-family:"Archivo";font-weight:700;font-size:9px;padding:5px 7px;border-radius:5px;border:1.5px solid var(--hair);color:var(--ink2);cursor:pointer;background:var(--panel2)}
.verb.on{border-color:var(--blue);color:var(--blue)}

.parts{flex:1;display:flex;flex-direction:column;min-height:0}
.ch{padding:9px 11px 5px;display:flex;justify-content:space-between;align-items:center}
.plist{flex:1;overflow:auto;padding:2px 7px 7px;display:flex;flex-direction:column;gap:4px}
.prow{border:1.5px solid var(--hair);border-radius:7px;background:var(--field);padding:5px 7px;cursor:pointer}
.prow.sel{box-shadow:0 0 0 1px currentColor,0 0 12px -6px currentColor}
.prow .pn{display:flex;justify-content:space-between;align-items:center;font-family:"Archivo";font-weight:800;font-size:10px}
.prow .pn small{font-weight:400;font-family:"DM Mono";color:var(--ink2);font-size:8px}
.role{font-size:7.5px;border:1px solid currentColor;border-radius:3px;padding:0 3px;opacity:.8}
.lane{height:16px;margin-top:4px;position:relative;border-radius:4px;background:linear-gradient(90deg,var(--grid),transparent)}
.lane .h,.lane .a{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;cursor:ew-resize}
.lane .h{border:2px solid currentColor;background:var(--field)} .lane .a{background:currentColor}
.lane .link{position:absolute;top:50%;height:2px;background:currentColor;opacity:.5;transform:translateY(-50%)}
.lane .cut{position:absolute;top:50%;width:2px;height:11px;background:var(--red);transform:translate(-50%,-50%);opacity:.75}
.prow .meta{display:flex;gap:9px;margin-top:4px;font-size:8px;color:var(--ink2)}

.foot{display:flex;align-items:center;gap:11px;padding:9px 12px}
.src{display:flex;border:1.5px solid var(--hair);border-radius:7px;overflow:hidden}
.src button{font-family:"DM Mono";font-size:10px;padding:6px 10px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.src button.on{background:var(--ink);color:var(--bg)}
.note{font-size:10px;color:var(--ink2);line-height:1.4;max-width:560px}
.note b{color:var(--green)}
</style>
</head>
<body>
<div class="app">
  <div class="flow"><b>1 · CORNER BANK</b><span>→</span><b class="on">2 · THE MOVE</b><span>→</span><b>3 · SURGICAL EDIT</b><span>→</span><b>4 · PACKED PROOF</b><span>→</span><b>5 · KEEP / KILL</b></div>
  <div class="head"><h1>THE MOVE</h1><div class="verdict" id="verdict"></div><div class="spacer"></div>
    <div class="kk kill">✕ KILL</div><div class="kk bake">▶ BAKE → 4×6</div></div>
  <div class="skins" id="skins"></div>

  <div class="main">
    <div class="col">
      <div class="card hero" id="hero">
        <svg id="svg" viewBox="0 0 900 400" preserveAspectRatio="none"></svg>
        <div class="freqax" id="freqax"></div>
        <div class="anchorstrip" id="anchorstrip"></div>
      </div>
      <div class="card transport">
        <div class="trow">
          <div class="play" id="play">▶</div>
          <div class="tbtn on" id="loop">⟲ LOOP</div>
          <select class="tin" id="speed" title="speed ×"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
          <input class="tin" id="inv" value="0" title="in %"/>
          <input class="tin" id="outv" value="100" title="out %"/>
          <div class="tlwrap"><div class="timeline" id="timeline"><div class="region" id="region"></div><div class="thandle in" id="hin"></div><div class="thandle out" id="hout"></div><div class="playhead" id="phead"></div></div><div class="ruler" id="ruler"></div></div>
        </div>
        <div class="trow">
          <div class="pushrow"><div class="pl">PUSH</div><div class="pslide" id="pslide"><div class="f" id="pf"></div><div class="k" id="pk"></div></div></div>
          <div class="verb on" data-v="tighter">TIGHTER</div><div class="verb" data-v="harder">HARDER</div><div class="verb" data-v="hollower">HOLLOW</div><div class="verb" data-v="torn">TORN</div><div class="verb" data-v="air">AIR</div>
          <div class="spacer"></div>
          <div class="snaps"><div class="snap" data-c="0">HOME</div><div class="snap" data-c="1">AWAY</div><div class="snap" data-c="2">P·HOME</div><div class="snap" data-c="3">P·AWAY</div></div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card parts"><div class="ch"><span class="lab">Six parts · frame + mouth</span></div><div class="plist" id="plist"></div></div>
    </div>
  </div>

  <div class="foot card">
    <div class="src" id="src"><button class="on" data-s="pink">PINK</button><button data-s="saw">SAW</button><button data-s="noise">808</button></div>
  </div>
</div>

<script>
const F0=20,F1=20000,LO=Math.log10(F0),HI=Math.log10(F1);
const xN=hz=>(Math.log10(Math.max(F0,Math.min(F1,hz)))-LO)/(HI-LO);
const hzAt=x=>Math.pow(10,LO+(HI-LO)*x);
const llerp=(a,b,t)=>Math.exp(Math.log(a)+(Math.log(b)-Math.log(a))*t);

/* ---- vocal skins: 2 broad frames + 4 mouth/bite rows, mandatory cuts, ≥1 remote counterweight ---- */
const FR='#4aa6df', FR2='#2fd6c4'; // frame colors
const M=['#e0473e','#e8742e','#e8a93c','#5dff77']; // mouth colors
function P(id,col,role,home,away,tight,level,cut){return{id,col,role,home,away,tight,level,cut};}
const SKINS={
 open:{name:'OPEN MOUTH', verb:'tighter', parts:()=>[
   P('1',FR,'frame',200,200,2,6,'hug'),P('2',M[0],'mouth',600,760,6,8,'hug'),P('3',M[1],'mouth',1100,1250,6,7,'tear'),
   P('4',M[2],'mouth',2500,2700,8,7,'hug'),P('5',M[3],'mouth',3300,3300,7,6,'hug'),P('6',FR2,'frame',8000,8000,1.5,5,'counter')]},
 ooh:{name:'OOH → EEE', verb:'tighter', parts:()=>[
   P('1',FR,'frame',220,220,2,6,'hug'),P('2',M[0],'mouth',350,300,7,8,'hug'),P('3',M[1],'mouth',600,2000,7,7,'tear'),
   P('4',M[2],'mouth',2200,2900,8,7,'hug'),P('5',M[3],'mouth',2800,3400,7,6,'hug'),P('6',FR2,'frame',7000,9000,1.5,5,'counter')]},
 eeh:{name:'EEH → AAH', verb:'tighter', parts:()=>[
   P('1',FR,'frame',230,230,2,6,'hug'),P('2',M[0],'mouth',320,700,7,8,'hug'),P('3',M[1],'mouth',2100,1150,7,7,'tear'),
   P('4',M[2],'mouth',2900,2600,8,7,'hug'),P('5',M[3],'mouth',3400,3000,7,6,'hug'),P('6',FR2,'frame',7500,7500,1.5,5,'counter')]},
 hedz:{name:'TALKING HEDZ', verb:'torn', parts:()=>[
   P('1',FR,'frame',250,250,2.5,6,'hug'),P('2',M[0],'mouth',400,350,9,8,'tear'),P('3',M[1],'mouth',900,1800,10,7,'tear'),
   P('4',M[2],'mouth',1900,2600,10,7,'hug'),P('5',M[3],'mouth',3000,3600,9,6,'hug'),P('6',FR2,'frame',6500,8500,1.6,5,'counter')]},
 deep:{name:'DEEP MOUTH', verb:'hollower', parts:()=>[
   P('1',FR,'frame',150,150,1.8,7,'hug'),P('2',M[0],'mouth',300,420,6,8,'tear'),P('3',M[1],'mouth',700,1000,6,7,'counter'),
   P('4',M[2],'mouth',1600,2000,7,6,'hug'),P('5',M[3],'mouth',2600,2800,6,5,'hug'),P('6',FR2,'frame',6000,6000,1.4,4,'counter')]},
 orator:{name:'ORATOR', verb:'harder', parts:()=>[
   P('1',FR,'frame',180,180,1.8,7,'hug'),P('2',M[0],'mouth',350,500,6,8,'hug'),P('3',M[1],'mouth',800,1300,6,7,'tear'),
   P('4',M[2],'mouth',1800,2400,7,6,'hug'),P('5',M[3],'mouth',3000,3200,6,5,'hug'),P('6',FR2,'frame',7000,7000,1.5,4,'counter')]},
 nasal:{name:'NASAL PINCH', verb:'tighter', parts:()=>[
   P('1',FR,'frame',240,240,2,6,'hug'),P('2',M[0],'mouth',400,360,8,7,'hug'),P('3',M[1],'mouth',1000,1400,9,6,'tear'),
   P('4',M[2],'mouth',2200,2800,9,7,'hug'),P('5',M[3],'mouth',3200,3500,8,6,'hug'),P('6',FR2,'frame',8000,8000,1.5,4,'counter')]},
};
function modal(ratios,f0,q,move){const cols=['#e0473e','#e8742e','#e8a93c','#5dff77','#2fd6c4','#4aa6df'];const a=[];
  for(let i=0;i<6;i++){const f=f0*(ratios[i]!==undefined?ratios[i]:(i+1));
    a.push(P(String(i+1),cols[i],i===0?'frame':'mouth',f,f*move,Math.max(2,q*Math.pow(0.88,i)),Math.max(3,8*Math.pow(0.85,i)),i===5?'counter':'hug'));}return a;}
function span(loF,hiF,q,move){const cols=['#e0473e','#e8742e','#e8a93c','#5dff77','#2fd6c4','#4aa6df'];const a=[];
  for(let i=0;i<6;i++){const f=llerp(loF,hiF,i/5);a.push(P(String(i+1),cols[i],i===0?'frame':'mouth',f,f*move,q,Math.max(3,8-i),i===5?'counter':'hug'));}return a;}
const MATERIALS={
 VOICE:SKINS,
 OBJECT:{
  tube:{name:'TUBE · steel',verb:'tighter',parts:()=>modal([1,3,5,7,9,11],71,9,1.30)},
  bell:{name:'BELL · glass',verb:'tighter',parts:()=>modal([1,2,2.4,3,4.5,5.33],520,12,1.22)},
  plate:{name:'PLATE',verb:'harder',parts:()=>modal([1,1.59,2.14,2.65,2.92,3.5],680,10,1.18)},
  cavity:{name:'CAVITY',verb:'hollower',parts:()=>modal([1,2.3,3.7,5,6.2,7.4],280,7,1.25)},
  bottle:{name:'BOTTLE',verb:'tighter',parts:()=>modal([1,2,4,7,10,13],150,8,1.35)},
  bar:{name:'BAR · wood',verb:'harder',parts:()=>modal([1,2.756,5.404,8.933,13.34,17.5],220,6,1.15)},
  shell:{name:'SHELL',verb:'tighter',parts:()=>modal([1,1.7,2.3,3.1,4,5.2],330,7,1.2)},
 },
 INSTRUMENT:{
  reed:{name:'REED',verb:'tighter',parts:()=>modal([1,3,5,7,9,11],180,11,1.12)},
  string:{name:'PLUCKED STRING',verb:'harder',parts:()=>modal([1,2,3,4,5,6],110,9,1.10)},
  bowed:{name:'BOWED',verb:'tighter',parts:()=>modal([1,2,3,4,5,6],196,12,1.08)},
  mallet:{name:'MALLET',verb:'harder',parts:()=>modal([1,3.9,9.2,16,24,32],260,10,1.14)},
 },
 ANALOG:{
  ladder:{name:'LADDER LP',verb:'harder',parts:()=>[P('1',FR,'frame',120,120,1.6,7,'hug'),P('2',M[0],'mouth',300,1200,9,8,'hug'),P('3',M[1],'mouth',600,2400,7,5,'hug'),P('4',M[2],'mouth',900,3600,6,3,'counter'),P('5',M[3],'mouth',1300,5000,5,2,'hug'),P('6',FR2,'frame',9000,9000,1.3,1,'counter')]},
  diode:{name:'DIODE 303',verb:'harder',parts:()=>[P('1',FR,'frame',90,90,1.6,7,'hug'),P('2',M[0],'mouth',250,2200,12,9,'hug'),P('3',M[1],'mouth',500,3000,8,4,'hug'),P('4',M[2],'mouth',750,4000,6,2,'counter'),P('5',M[3],'mouth',1100,5200,5,1,'hug'),P('6',FR2,'frame',9000,9000,1.3,1,'counter')]},
  sem:{name:'SEM 12dB',verb:'tighter',parts:()=>[P('1',FR,'frame',140,140,1.6,7,'hug'),P('2',M[0],'mouth',350,1400,6,8,'hug'),P('3',M[1],'mouth',700,2800,5,5,'tear'),P('4',M[2],'mouth',1100,3800,5,3,'counter'),P('5',M[3],'mouth',1700,5200,4,2,'hug'),P('6',FR2,'frame',8000,8000,1.3,2,'counter')]},
  ms20:{name:'MS-20',verb:'torn',parts:()=>[P('1',FR,'frame',160,300,2,5,'tear'),P('2',M[0],'mouth',400,1500,8,8,'hug'),P('3',M[1],'mouth',800,2600,7,5,'tear'),P('4',M[2],'mouth',1300,3800,6,3,'counter'),P('5',M[3],'mouth',2000,5400,5,2,'hug'),P('6',FR2,'frame',8500,8500,1.3,2,'counter')]},
 },
 PRIMITIVE:{
  formant:{name:'FORMANT 3-PEAK',verb:'tighter',parts:()=>span(300,3300,6,1.4)},
  comb:{name:'COMB TEETH',verb:'tighter',parts:()=>modal([1,1.5,2.25,3.375,5.06,7.6],90,6,1.6)},
  cluster:{name:'MID CLUSTER',verb:'tighter',parts:()=>modal([1,1.25,1.6,2,2.5,3.1],800,9,1.3)},
  crossers:{name:'CROSSERS',verb:'torn',parts:()=>[P('1',FR,'frame',200,200,2,6,'hug'),P('2',M[0],'mouth',250,3000,6,8,'tear'),P('3',M[1],'mouth',4000,600,6,8,'tear'),P('4',M[2],'mouth',900,1500,6,6,'counter'),P('5',M[3],'mouth',5000,9000,5,5,'hug'),P('6',FR2,'frame',12000,12000,1.4,4,'counter')]},
  lowpass:{name:'RESONANT LP',verb:'harder',parts:()=>[P('1',FR,'frame',120,120,1.6,7,'hug'),P('2',M[0],'mouth',300,900,8,8,'hug'),P('3',M[1],'mouth',600,1800,7,6,'hug'),P('4',M[2],'mouth',1000,3000,6,4,'counter'),P('5',M[3],'mouth',1600,4800,5,3,'hug'),P('6',FR2,'frame',8000,8000,1.3,2,'counter')]},
 },
};
let curType='VOICE', curKey='ooh', parts=MATERIALS.VOICE.ooh.parts(), verb=MATERIALS.VOICE.ooh.verb;
let sweep=0, push=0, sel=2, source='pink';
let loopOn=true, inP=0, outP=1, speed=1, playing=false, phase=0, raf=null;

function partAt(pt,m,p){let f=llerp(pt.home,pt.away,m),tight=pt.tight,level=pt.level,cutDepth=(pt.cut==='hug'?5:pt.cut==='tear'?13:7);
  if(verb==='tighter')tight*=(1+1.1*p); if(verb==='harder'){level+=5*p;tight*=(1+0.3*p);} if(verb==='hollower')cutDepth*=(1+1.3*p); if(verb==='torn')cutDepth*=(1+1.6*p);
  if(verb==='air'&&pt.role==='frame'&&pt.home>3000)level+=6*p;
  let cutHz=pt.cut==='hug'?f*0.667:pt.cut==='tear'?f*1.18:f*0.18;
  return {f,tight,level,cutDepth,cutHz};}
function bump(fc,db,tight,hz){const r=Math.log2(hz/fc),bw=1/Math.max(0.25,tight*0.5);return db*Math.exp(-(r*r)/(2*bw*bw));}
function mag(m,p,hz){let d=0;for(const pt of parts){const a=partAt(pt,m,p);d+=bump(a.f,a.level,a.tight,hz);d-=bump(a.cutHz,a.cutDepth,Math.max(2,a.tight*0.7),hz);}return d;}
function curve(m,p,N){const a=[];for(let i=0;i<N;i++)a.push(mag(m,p,hzAt(i/(N-1))));return a;}
function pathFrom(a,W,H,pad){let s='';const MAX=24,MIN=-16;for(let i=0;i<a.length;i++){const x=i/(a.length-1)*W;
  const v=Math.max(MIN,Math.min(MAX,a[i]));const y=H-pad-((v-MIN)/(MAX-MIN))*(H-pad*1.5);s+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' ';}return s;}
function yAt(a,hz,H,pad){const i=Math.round(xN(hz)*(a.length-1)),MAX=24,MIN=-16;const v=Math.max(MIN,Math.min(MAX,a[i]||0));return H-pad-((v-MIN)/(MAX-MIN))*(H-pad*1.5);}

function renderHero(){const W=900,H=400,pad=28,svg=document.getElementById('svg');
  let g=`<defs><filter id="gl" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3.4"/></filter>
   <linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5dff77" stop-opacity=".28"/><stop offset="1" stop-color="#5dff77" stop-opacity="0"/></linearGradient></defs>`;
  const BASE=H-pad, yDb=db=>BASE-((db+16)/40)*(H-pad*1.5);
  [20,40,80,160,320,640,1250,2500,5000,10000,20000].forEach(f=>{const x=xN(f)*W;g+=`<line x1="${x}" y1="8" x2="${x}" y2="${BASE}" stroke="#12241b"/>`;});
  [18,12,6,0,-6,-12].forEach(db=>{const y=yDb(db);g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#0c1812"/><text x="3" y="${y-2}" fill="#33433a" font-size="8" font-family="DM Mono">${db>0?'+':''}${db}</text>`;});
  const cur=curve(sweep,push,200),dp=pathFrom(cur,W,H,pad);
  g+=`<path d="${dp} L${W},${BASE} L0,${BASE} Z" fill="url(#gf)"/><path d="${dp}" fill="none" stroke="#5dff77" stroke-opacity=".4" stroke-width="6" filter="url(#gl)"/><path d="${dp}" fill="none" stroke="#5dff77" stroke-width="2.4" stroke-linejoin="round"/>`;
  parts.forEach(pt=>{const a=partAt(pt,sweep,push);g+=`<line x1="${xN(pt.home)*W}" y1="${yAt(cur,pt.home,H,pad)}" x2="${xN(pt.away)*W}" y2="${yAt(cur,pt.away,H,pad)}" stroke="${pt.col}" stroke-opacity=".2" stroke-dasharray="3 3"/><circle cx="${xN(a.f)*W}" cy="${yAt(cur,a.f,H,pad)}" r="4.3" fill="${pt.col}"/>`;});
  svg.innerHTML=g;
  const hero=document.getElementById('hero');hero.querySelectorAll('.pnode,.pcall').forEach(e=>e.remove());
  parts.forEach((pt,i)=>{const a=partAt(pt,sweep,push);const xc=xN(a.f)*100,yc=yAt(cur,a.f,H,pad)/H*100;
    const el=document.createElement('div');el.className='pnode';el.style.left=xc+'%';el.style.top=yc+'%';
    el.innerHTML=`<div class="t" style="border-color:${pt.col};color:${pt.col}${i===sel?';box-shadow:0 0 9px '+pt.col:''}">${pt.id}</div>`;hero.appendChild(el);
    if(i===sel){const c=document.createElement('div');c.className='pcall';c.style.left=xc+'%';c.style.top=(yc-5)+'%';c.innerHTML=`<b>${fmt(a.f)}</b>`;hero.appendChild(c);}});
}
function fmt(f){return f>=1000?(f/1000).toFixed(2)+'k':Math.round(f)+' Hz';}
function posName(){return (sweep<0.05?'HOME':sweep>0.95?'AWAY':'MID '+Math.round(sweep*100))+(push>0.95?' · PUSH':push>0.05?' · push '+Math.round(push*100):'');}

function renderParts(){const list=document.getElementById('plist');list.innerHTML='';
  parts.forEach((pt,i)=>{const xh=xN(pt.home)*100,xa=xN(pt.away)*100,xc=xN(partAt(pt,sweep,push).cutHz)*100;
    const oct=Math.log2(pt.away/pt.home),mw=pt.role==='frame'?'frame':Math.abs(oct)<0.1?'holds':`${oct>0?'+':''}${oct.toFixed(1)} oct`;
    const d=document.createElement('div');d.className='prow'+(i===sel?' sel':'');d.style.color=pt.col;
    d.innerHTML=`<div class="pn" style="color:${pt.col}">PART ${pt.id} <span class="role">${pt.role}</span><small>${fmt(pt.home)}→${fmt(pt.away)} · ${mw}</small></div>
      <div class="lane" data-i="${i}"><div class="link" style="left:${Math.min(xh,xa)}%;width:${Math.abs(xa-xh)}%"></div><div class="cut" style="left:${xc}%"></div><div class="h" data-end="home" style="left:${xh}%"></div><div class="a" data-end="away" style="left:${xa}%"></div></div>
      <div class="meta"><span>tight ${pt.tight.toFixed(0)}</span><span>level ${pt.level.toFixed(0)}</span><span>cut: ${pt.cut}</span></div>`;
    d.onclick=()=>{sel=i;renderParts();renderHero();};list.appendChild(d);});
  bindLanes();}
const OCTRAILS=[20,40,80,160,320,640,1250,2500,5000,10000,20000];
function softSnap(hz){let best=hz,bd=0.1;for(const r of OCTRAILS){const d=Math.abs(Math.log2(hz/r));if(d<bd){bd=d;best=r;}}return best;}
function bindLanes(){document.querySelectorAll('.lane').forEach(lane=>{const i=+lane.dataset.i;
  lane.querySelectorAll('.h,.a').forEach(h=>{h.onmousedown=e=>{e.stopPropagation();const end=h.dataset.end;
    const drag=ev=>{const r=lane.getBoundingClientRect();const x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));const hz=softSnap(hzAt(x));
      if(end==='home')parts[i].home=hz;else parts[i].away=hz;sel=i;renderParts();renderHero();renderVerdict();syncAudio();};
    drag(e);const mv=ev=>drag(ev);const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);};});});}

function renderMaterials(){const wrap=document.getElementById('skins');wrap.innerHTML='';
  Object.keys(MATERIALS).forEach(type=>{const s=document.createElement('select');s.className='tin matsel'+(type===curType?' on':'');
    const hdr=document.createElement('option');hdr.value='';hdr.textContent=type+' ▾';if(type!==curType)hdr.selected=true;s.appendChild(hdr);
    Object.keys(MATERIALS[type]).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=MATERIALS[type][k].name;if(type===curType&&k===curKey)o.selected=true;s.appendChild(o);});
    s.onchange=()=>{if(s.value)pickMaterial(type,s.value);};wrap.appendChild(s);});}
function pickMaterial(t,k){curType=t;curKey=k;parts=MATERIALS[t][k].parts();verb=MATERIALS[t][k].verb;sel=2;renderMaterials();renderVerb();renderAll();rebuildAudio();}
function renderVerb(){document.querySelectorAll('.verb').forEach(b=>b.classList.toggle('on',b.dataset.v===verb));}

function renderVerdict(){const diff=maxDiff(curve(0,0,120),curve(1,0,120)),mush=midSmear(0.5,0);
  let l=[];l.push(diff>6?`<b>HOME↔AWAY clearly different</b> (${diff.toFixed(0)} dB)`:`<b style="color:var(--amber)">too similar</b> — timid, kill`);
  l.push(mush?`<b style="color:var(--amber)">middle smears</b>`:`<b>middle alive</b>`);document.getElementById('verdict').innerHTML=l.join(' · ');}
function maxDiff(a,b){let m=0;for(let i=0;i<a.length;i++)m=Math.max(m,Math.abs(a[i]-b[i]));return m;}
function midSmear(m,p){const c=curve(m,p,120);let k=0;for(let i=2;i<c.length-2;i++)if(c[i]>c[i-1]&&c[i]>c[i+1]&&c[i]>2)k++;return k<2;}

/* transport */
function renderTransport(){document.getElementById('region').style.left=(inP*100)+'%';document.getElementById('region').style.width=((outP-inP)*100)+'%';
  document.getElementById('hin').style.left=(inP*100)+'%';document.getElementById('hout').style.left=(outP*100)+'%';
  document.getElementById('phead').style.left=(sweep*100)+'%';
  document.getElementById('pf').style.width=(push*100)+'%';document.getElementById('pk').style.left=(push*100)+'%';}
function bindTransport(){
  const tl=document.getElementById('timeline');
  const dragH=(el,which)=>{el.onmousedown=e=>{e.stopPropagation();const mv=ev=>{const r=tl.getBoundingClientRect();let x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
    if(which==='in'){inP=Math.min(x,outP-0.02);document.getElementById('inv').value=Math.round(inP*100);}else{outP=Math.max(x,inP+0.02);document.getElementById('outv').value=Math.round(outP*100);}renderTransport();};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);};};
  dragH(document.getElementById('hin'),'in');dragH(document.getElementById('hout'),'out');
  tl.onmousedown=e=>{if(e.target.classList.contains('thandle'))return;const set=ev=>{const r=tl.getBoundingClientRect();sweep=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));renderAll();syncAudio();};
    set(e);const mv=ev=>set(ev);const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);};
  document.getElementById('inv').onchange=e=>{inP=Math.max(0,Math.min(0.98,(+e.target.value||0)/100));renderTransport();};
  document.getElementById('outv').onchange=e=>{outP=Math.max(inP+0.02,Math.min(1,(+e.target.value||100)/100));renderTransport();};
  document.getElementById('speed').onchange=e=>{speed=+e.target.value;};
  document.getElementById('loop').onclick=function(){loopOn=!loopOn;this.classList.toggle('on',loopOn);};
  const ps=document.getElementById('pslide');const setp=e=>{const r=ps.getBoundingClientRect();push=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));renderAll();syncAudio();};
  ps.onmousedown=e=>{setp(e);const mv=ev=>setp(ev);const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);};
  document.querySelectorAll('.verb').forEach(b=>b.onclick=()=>{verb=b.dataset.v;if(push<0.05)push=0.6;renderVerb();renderAll();syncAudio();});
  document.querySelectorAll('.snap').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;sweep=(c&1)?1:0;push=(c&2)?1:0;renderAll();syncAudio();});}

function renderAxis(){
  document.getElementById('freqax').innerHTML=[[20,'20'],[40,'40'],[80,'80'],[160,'160'],[320,'320'],[640,'640'],[1250,'1.25k'],[2500,'2.5k'],[5000,'5k'],[10000,'10k'],[20000,'20k']].map(l=>`<span style="left:${(xN(l[0])*100).toFixed(2)}%">${l[1]}</span>`).join('');
  const bands=[['SUB',30,150],['THROAT',150,950],['VOWEL',700,2500],['BITE',1800,3600],['EDGE',3000,5200],['AIR',5000,12000]];
  document.getElementById('anchorstrip').innerHTML=bands.map(b=>`<div class="ab" style="left:${(xN(Math.sqrt(b[1]*b[2]))*100).toFixed(2)}%">${b[0]}</div>`).join('');}
function renderRuler(){let h='';for(let i=0;i<=100;i+=10){h+=`<div class="tk" style="left:${i}%"></div><div class="tn" style="left:${i}%">${i}</div>`;}document.getElementById('ruler').innerHTML=h;}
function renderAll(){renderHero();renderParts();renderVerdict();renderTransport();}

/* audio + playback loop */
let actx=null,master=null,srcNode=null,filters=[];
function ensureCtx(){if(actx)return;actx=new(window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=0;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=14000;master.connect(lp);lp.connect(actx.destination);}
function makeSrc(){if(source==='saw'){const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=82.4;o.start();return o;}
  const len=actx.sampleRate*2,buf=actx.createBuffer(1,len,actx.sampleRate),ch=buf.getChannelData(0);let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(source==='pink'){b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;ch[i]=(b0+b1+b2+w*.1848)*.12;}else ch[i]=w*.25;}
  const s=actx.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;}
function rebuildAudio(){if(playing)buildChain();}
function buildChain(){if(srcNode){try{srcNode.disconnect()}catch(e){}}filters.forEach(f=>f.disconnect());filters=[];srcNode=makeSrc();let node=srcNode;
  for(const pt of parts){const a=partAt(pt,sweep,push);const pk=actx.createBiquadFilter();pk.type='peaking';pk.frequency.value=Math.min(16000,a.f);pk.Q.value=Math.max(0.7,a.tight*1.2);pk.gain.value=Math.max(-12,Math.min(15,a.level*1.4));node.connect(pk);node=pk;filters.push(pk);
    const cu=actx.createBiquadFilter();cu.type='peaking';cu.frequency.value=Math.min(16000,a.cutHz);cu.Q.value=4;cu.gain.value=-a.cutDepth;node.connect(cu);node=cu;filters.push(cu);}
  node.connect(master);}
function syncAudio(){if(!playing||!actx)return;if(filters.length!==parts.length*2){buildChain();return;}let k=0;for(const pt of parts){const a=partAt(pt,sweep,push);
  if(filters[k]){filters[k].frequency.value=Math.min(16000,a.f);filters[k].Q.value=Math.max(0.7,a.tight*1.2);filters[k].gain.value=Math.max(-12,Math.min(15,a.level*1.4));}
  if(filters[k+1]){filters[k+1].frequency.value=Math.min(16000,a.cutHz);filters[k+1].gain.value=-a.cutDepth;}k+=2;}}
document.getElementById('play').onclick=()=>{ensureCtx();if(actx.state==='suspended')actx.resume();playing=!playing;document.getElementById('play').textContent=playing?'■':'▶';
  if(playing){buildChain();master.gain.linearRampToValueAtTime(0.5,actx.currentTime+0.05);phase=inP;tick();}else master.gain.linearRampToValueAtTime(0,actx.currentTime+0.05);};
function tick(){if(!playing)return;phase+=0.004*speed;if(phase>=outP){if(loopOn)phase=inP;else{phase=outP;sweep=outP;renderTransport();playing=false;document.getElementById('play').textContent='▶';master.gain.linearRampToValueAtTime(0,actx.currentTime+0.05);return;}}
  sweep=phase;renderHero();renderTransport();syncAudio();raf=requestAnimationFrame(tick);}
document.getElementById('src').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#src button').forEach(x=>x.classList.remove('on'));b.classList.add('on');source=b.dataset.s;rebuildAudio();};

renderMaterials();bindTransport();renderAxis();renderRuler();renderAll();
</script>
</body>
</html>
