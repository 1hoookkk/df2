[package]
name = "forge"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The audio path plays through the SHARED engine (real AGC/grit/wide), not a
# re-ported bare filter — see [[one-rust-surface-shared-ffi-engine]] /
# [[packed-math-triplicated]]. Path dep, not a workspace member.
trench-core = { path = "../trench-core" }

# Standalone — its own workspace root, not a member of the df2 workspace.
[workspace]

# Build deps (eframe, cpal, trench-core) optimized even in dev so the real-time
# audio callback isn't running unoptimized DSP. Our own code stays at 0 for fast
# incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3
