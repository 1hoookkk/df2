# cbindgen configuration for the trench-core C ABI.
#
# Generates a C header (with C++ `extern "C"` guards) for every `#[no_mangle]
# pub extern "C"` function in src/ffi.rs. This is currently a STAGED / opt-in
# workflow: the canonical prototypes still live, hand-written, in
# juce-shell/source/dsp/TrenchDspBridge.h. Run scripts/gen-ffi-header.ps1 to
# regenerate include/trench_core_ffi.h and diff it against the hand-written block
# so the two can never silently drift. Wiring generation into the CMake build is
# deferred until cbindgen is a guaranteed toolchain dependency.

language = "C"
cpp_compat = true
pragma_once = true
include_guard = "TRENCH_CORE_FFI_H"
autogen_warning = "/* AUTO-GENERATED by cbindgen from trench-core/src/ffi.rs. Do not edit by hand — run scripts/gen-ffi-header.ps1. */"
style = "type"
no_includes = false

[export]
# Only the C ABI functions — no internal Rust types leak into the header.
item_types = ["functions"]

[parse]
parse_deps = false

[fn]
sort_by = "None"
