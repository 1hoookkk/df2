# cbindgen configuration for the trench-core C ABI.
#
# Generates a C header (with C++ `extern "C"` guards) for every retained
# `#[no_mangle] pub extern "C"` function in src/ffi.rs.

language = "C"
cpp_compat = true
pragma_once = true
include_guard = "TRENCH_CORE_FFI_H"
autogen_warning = "/* AUTO-GENERATED by cbindgen from trench-core/src/ffi.rs. Do not edit by hand. */"
style = "type"
no_includes = false

[export]
# Only the C ABI functions — no internal Rust types leak into the header.
item_types = ["functions"]

[parse]
parse_deps = false

[fn]
sort_by = "None"
